name: Require linked issue

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]

permissions:
  issues: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check-linked-issue:
    name: Require linked issue
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Verify the tracking issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          QUEUE_BRANCH: ${{ github.event.merge_group.head_ref }}
        run: |
          set -euo pipefail

          if [[ -z "$PR_NUMBER" ]]; then
            if [[ ! $QUEUE_BRANCH =~ ^refs/heads/gh-readonly-queue/main/pr-([1-9][0-9]*)-[0-9a-f]+$ ]]; then
              echo '::error::Run this check for a pull request, or for a merge group whose queue branch names its pull request.'
              exit 1
            fi
            PR_NUMBER=${BASH_REMATCH[1]}
          fi

          if ! body=$(timeout 30s gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            --jq '(.body // "") | gsub("(?s)<!--.*?(-->|$)"; "")'); then
            echo '::error::Could not read the PR description from GitHub.'
            exit 1
          fi

          issue_number=''
          issue_pattern='^(issue|close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved)(:[[:blank:]]*|[[:blank:]]+)#([1-9][0-9]*)[[:blank:]]*$'
          while IFS= read -r line; do
            line=${line%$'\r'}
            if [[ ${line,,} =~ $issue_pattern ]]; then
              issue_number=${BASH_REMATCH[3]}
              break
            fi
          done <<< "$body"

          if [[ -z "$issue_number" ]]; then
            echo '::error::Add a standalone Issue #123, Issue: #123, or GitHub closing reference such as Closes #123, Fixes #123 or Resolves #123 naming an issue in this repository.'
            exit 1
          fi

          if ! issue_url=$(timeout 30s gh api "repos/$GITHUB_REPOSITORY/issues/$issue_number" \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            --jq 'if type == "object" and (has("pull_request") | not) then .url else "" end'); then
            echo '::error::Could not verify the tracking issue. Check that it exists in this repository and retry if GitHub is unavailable.'
            exit 1
          fi

          if [[ "$issue_url" != "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$issue_number" ]]; then
            echo '::error::The reference must identify an issue in this repository, not a pull request or a transferred issue.'
            exit 1
          fi

          printf 'Verified tracking issue #%s.\n' "$issue_number"
