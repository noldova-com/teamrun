name: Build and test

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      run-code: ${{ steps.scope.outputs.run-code }}
      run-ui: ${{ steps.scope.outputs.run-ui }}
      targets: ${{ steps.scope.outputs.targets }}
      target-table: ${{ steps.scope.outputs.target-table }}
      ui-targets: ${{ steps.scope.outputs.ui-targets }}
      ui-plan: ${{ steps.scope.outputs.ui-plan }}
      deferred: ${{ steps.scope.outputs.deferred }}
      ui-deferred: ${{ steps.scope.outputs.ui-deferred }}
    steps:
      - name: Check out the change history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js to classify
        id: node
        continue-on-error: true
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '26.7.0'
          package-manager-cache: false

      - name: Wait before setting up Node.js to classify again
        if: steps.node.outcome == 'failure'
        run: sleep 30

      - name: Set up Node.js to classify again
        id: node-again
        if: steps.node.outcome == 'failure'
        continue-on-error: true
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '26.7.0'
          package-manager-cache: false

      - name: Wait before setting up Node.js to classify a last time
        if: steps.node-again.outcome == 'failure'
        run: sleep 30

      - name: Set up Node.js to classify a last time
        if: steps.node-again.outcome == 'failure'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '26.7.0'
          package-manager-cache: false

      - name: Check the documents
        run: npm test -- documents

      - name: Select the verification scope and the jobs
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: node scripts/classify-changes.ts

  validate:
    name: Build and test (${{ matrix.target }})
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.run-code == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.targets) }}
    uses: ./.github/workflows/build-and-test-target.yml
    with:
      runner: ${{ matrix.runner }}
      architecture: ${{ matrix.architecture }}
      jobs: ${{ toJSON(matrix.jobs) }}

  ui-linux-x64:
    name: UI workflows (Linux x64)
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.run-ui == 'true' && contains(format(' {0} ', needs.changes.outputs.ui-targets), ' linux-x64 ') }}
    uses: ./.github/workflows/ui-workflows.yml
    with:
      plan: ${{ toJSON(fromJSON(needs.changes.outputs.ui-plan)['linux-x64']) }}

  ui-linux-arm64:
    name: UI workflows (Linux ARM64)
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.run-ui == 'true' && contains(format(' {0} ', needs.changes.outputs.ui-targets), ' linux-arm64 ') }}
    uses: ./.github/workflows/ui-workflows.yml
    with:
      plan: ${{ toJSON(fromJSON(needs.changes.outputs.ui-plan)['linux-arm64']) }}

  ui-windows-x64:
    name: UI workflows (Windows x64)
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.run-ui == 'true' && contains(format(' {0} ', needs.changes.outputs.ui-targets), ' windows-x64 ') }}
    uses: ./.github/workflows/ui-workflows.yml
    with:
      plan: ${{ toJSON(fromJSON(needs.changes.outputs.ui-plan)['windows-x64']) }}

  ui-windows-arm64:
    name: UI workflows (Windows ARM64)
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.run-ui == 'true' && contains(format(' {0} ', needs.changes.outputs.ui-targets), ' windows-arm64 ') }}
    uses: ./.github/workflows/ui-workflows.yml
    with:
      plan: ${{ toJSON(fromJSON(needs.changes.outputs.ui-plan)['windows-arm64']) }}

  ui-macos-x64:
    name: UI workflows (macOS x64)
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.run-ui == 'true' && contains(format(' {0} ', needs.changes.outputs.ui-targets), ' macos-x64 ') }}
    uses: ./.github/workflows/ui-workflows.yml
    with:
      plan: ${{ toJSON(fromJSON(needs.changes.outputs.ui-plan)['macos-x64']) }}

  ui-macos-arm64:
    name: UI workflows (macOS ARM64)
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.run-ui == 'true' && contains(format(' {0} ', needs.changes.outputs.ui-targets), ' macos-arm64 ') }}
    uses: ./.github/workflows/ui-workflows.yml
    with:
      plan: ${{ toJSON(fromJSON(needs.changes.outputs.ui-plan)['macos-arm64']) }}

  cache-plan:
    name: Find the missing dependency caches
    needs: changes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      targets: ${{ steps.plan.outputs.targets }}
    steps:
      - name: Check out the lockfiles
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: List the targets without a current cache
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          ROOT_HASH: ${{ hashFiles('package-lock.json') }}
          SOURCE_HASH: ${{ hashFiles('src/package-lock.json') }}
          TARGET_TABLE: ${{ needs.changes.outputs.target-table }}
        run: |
          set -euo pipefail
          test -n "$TARGET_TABLE"
          keys=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/caches?key=dependencies-&ref=refs/heads/main&per_page=100" --jq '.actions_caches[].key')
          saved() {
            case $'\n'"$keys"$'\n' in
              *$'\n'"$1"$'\n'*) return 0 ;;
              *) return 1 ;;
            esac
          }
          targets=''
          while IFS='|' read -r target runner os architecture; do
            if ! saved "dependencies-root-$os-$architecture-$ROOT_HASH" || ! saved "dependencies-src-$os-$architecture-$SOURCE_HASH"; then
              targets="$targets${targets:+,}{\"target\":\"$target\",\"runner\":\"$runner\",\"architecture\":\"$architecture\"}"
              echo "$target has no current dependency cache."
            fi
          done <<< "${TARGET_TABLE//;/$'\n'}"
          echo "targets=[$targets]" >> "$GITHUB_OUTPUT"

  cache:
    name: Save the dependency caches (${{ matrix.target }})
    needs: cache-plan
    if: needs.cache-plan.outputs.targets != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.cache-plan.outputs.targets) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - name: Stop Spotlight indexing while saving
        if: runner.os == 'macOS'
        run: sudo mdutil -i off /System/Volumes/Data

      - name: Check out the revision to install
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js to install
        id: node
        continue-on-error: true
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '26.7.0'
          architecture: ${{ matrix.architecture }}
          package-manager-cache: false

      - name: Wait before setting up Node.js to install again
        if: steps.node.outcome == 'failure'
        run: sleep 30

      - name: Set up Node.js to install again
        id: node-again
        if: steps.node.outcome == 'failure'
        continue-on-error: true
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '26.7.0'
          architecture: ${{ matrix.architecture }}
          package-manager-cache: false

      - name: Wait before setting up Node.js to install a last time
        if: steps.node-again.outcome == 'failure'
        run: sleep 30

      - name: Set up Node.js to install a last time
        if: steps.node-again.outcome == 'failure'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '26.7.0'
          architecture: ${{ matrix.architecture }}
          package-manager-cache: false

      - name: Verify the toolchain to install
        env:
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          node --version
          npm --version
          node --print "process.platform + '/' + process.arch"
          test "$(node --version)" = v26.7.0
          test "$(npm --version)" = 11.19.0
          test "$(node --print process.arch)" = "$EXPECTED_ARCHITECTURE"

      - name: Restore the saved installed dependencies
        id: root-dependencies
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: dependencies-root-${{ runner.os }}-${{ matrix.architecture }}-${{ hashFiles('package-lock.json') }}

      - name: Look up the Angular project's saved dependencies
        id: angular-dependencies
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src/node_modules
          key: dependencies-src-${{ runner.os }}-${{ matrix.architecture }}-${{ hashFiles('src/package-lock.json') }}
          lookup-only: true

      - name: Install the dependencies to save
        if: steps.root-dependencies.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund

      - name: Install Electron to save
        if: steps.root-dependencies.outputs.cache-hit != 'true'
        run: |
          for attempt in 1 2 3 4; do
            if node node_modules/electron/install.js; then
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then
              echo "Electron's binary download failed (attempt $attempt of 4); trying again in 15 seconds."
              sleep 15
            fi
          done
          echo "::error::Electron's binary could not be downloaded in 4 attempts."
          exit 1

      - name: Save the installed dependencies
        if: steps.root-dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: ${{ steps.root-dependencies.outputs.cache-primary-key }}

      - name: Install the Angular project to save
        if: steps.angular-dependencies.outputs.cache-hit != 'true'
        run: npm run build

      - name: Save the Angular project's installed dependencies
        if: steps.angular-dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src/node_modules
          key: ${{ steps.angular-dependencies.outputs.cache-primary-key }}

  caches:
    name: Remove outdated dependency caches
    needs: [cache-plan, cache]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.cache-plan.result == 'success' && (needs.cache.result == 'success' || needs.cache.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Check out the revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Delete caches of other lockfiles
        env:
          GH_TOKEN: ${{ github.token }}
          ROOT_HASH: ${{ hashFiles('package-lock.json') }}
          SOURCE_HASH: ${{ hashFiles('src/package-lock.json') }}
        run: |
          set -euo pipefail
          keys=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/caches?key=dependencies-&ref=refs/heads/main&per_page=100" --jq '.actions_caches[].key')
          while IFS= read -r key; do
            case "$key" in
              '' | dependencies-root-*-"$ROOT_HASH" | dependencies-src-*-"$SOURCE_HASH")
                ;;
              *)
                gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/caches?key=$key&ref=refs/heads/main" > /dev/null
                echo "Deleted the outdated cache $key."
                ;;
            esac
          done <<< "$keys"

  result:
    name: Build and test (all targets)
    needs: [changes, validate, ui-linux-x64, ui-linux-arm64, ui-windows-x64, ui-windows-arm64, ui-macos-x64, ui-macos-arm64]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require the selected verification to pass
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RUN_CODE: ${{ needs.changes.outputs.run-code }}
          RUN_UI: ${{ needs.changes.outputs.run-ui }}
          VALIDATION_RESULT: ${{ needs.validate.result }}
          UI_TARGETS: ${{ needs.changes.outputs.ui-targets }}
          UI_RESULTS: >-
            linux-x64=${{ needs.ui-linux-x64.result }}
            linux-arm64=${{ needs.ui-linux-arm64.result }}
            windows-x64=${{ needs.ui-windows-x64.result }}
            windows-arm64=${{ needs.ui-windows-arm64.result }}
            macos-x64=${{ needs.ui-macos-x64.result }}
            macos-arm64=${{ needs.ui-macos-arm64.result }}
          DEFERRED: ${{ needs.changes.outputs.deferred }}
          UI_DEFERRED: ${{ needs.changes.outputs.ui-deferred }}
        run: |
          set -euo pipefail
          if [ -n "$DEFERRED" ]; then
            covered="every target this run covers. Skipped here and run on every push to main and in manual runs: $DEFERRED."
          elif [ -n "$UI_DEFERRED" ]; then
            covered="every target, with the UI workflows of $UI_DEFERRED left to manual and nightly runs."
          else
            covered='every target.'
          fi
          planned=skipped
          if [ "$RUN_UI" = true ]; then
            planned=success
          fi
          ui=$planned
          if [ -z "$UI_TARGETS" ]; then
            ui=failure
          fi
          for entry in $UI_RESULTS; do
            case " $UI_TARGETS " in
              *" ${entry%%=*} "*) expected=$planned ;;
              *) expected=skipped ;;
            esac
            if [ "${entry#*=}" != "$expected" ]; then
              ui=failure
            fi
          done
          case "$CHANGES_RESULT:$RUN_CODE:$RUN_UI:$VALIDATION_RESULT:$ui" in
            success:false:false:skipped:skipped)
              echo 'Only Markdown documentation changed: the document checks passed, and the build and test targets were skipped.' >> "$GITHUB_STEP_SUMMARY"
              ;;
            success:true:false:success:skipped)
              echo "Only documentation, CI and test tooling or repository configuration changed: the document checks passed, the build and tests passed on $covered The UI workflows were not required." >> "$GITHUB_STEP_SUMMARY"
              ;;
            success:true:true:success:success)
              echo "The document checks passed, and the build, tests and UI workflows passed on $covered" >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo '::error::The document checks, the change classification, a build and test target or a UI workflow shard did not complete successfully.'
              exit 1
              ;;
          esac
