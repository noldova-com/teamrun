name: Package

on:
  workflow_call:
    inputs:
      nightly:
        description: Whether the nightly run calls it, which packages Windows x64 and Linux x64 only and records each job's result for its report.
        type: boolean
        required: true
  workflow_dispatch:
    inputs:
      signed:
        description: Whether to sign the packages of the platforms that teamrun.signedPlatforms declares, which needs the release environment's approval. Only from main.
        type: boolean
        default: false
      update-feed:
        description: A local update feed for a native update check, such as http://127.0.0.1:47325/, which the packages name instead of the production feed. Only a loopback HTTP URL.
        type: string
        default: ''
      version:
        description: A product version for a native update check, such as 0.0.2, which the packages carry instead of the root manifest's. Only X.Y.Z, newer than the root manifest's.
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: package-${{ inputs.nightly && 'nightly' || 'manual' }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  plan:
    name: List the targets to package
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
      signed-targets: ${{ steps.targets.outputs.signed-targets }}
    steps:
      - name: Require main for a signed run
        if: github.event_name == 'workflow_dispatch' && inputs.signed
        timeout-minutes: 1
        env:
          REFERENCE: ${{ github.ref }}
        run: |
          if [ "$REFERENCE" != refs/heads/main ]; then
            echo "::error::A signed package run starts from main, not from $REFERENCE."
            exit 1
          fi

      - name: Check out the revision
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        id: node
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '26.7.0'
          package-manager-cache: false

      - name: Wait before setting up Node.js again
        if: steps.node.outcome == 'failure'
        timeout-minutes: 1
        run: sleep 30

      - name: Set up Node.js again
        id: node-again
        if: steps.node.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '26.7.0'
          package-manager-cache: false

      - name: Wait before setting up Node.js a last time
        if: steps.node-again.outcome == 'failure'
        timeout-minutes: 1
        run: sleep 30

      - name: Set up Node.js a last time
        if: steps.node-again.outcome == 'failure'
        timeout-minutes: 5
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '26.7.0'
          package-manager-cache: false

      - name: List every target by hand and Windows x64 and Linux x64 each night
        id: targets
        timeout-minutes: 1
        env:
          NIGHTLY: ${{ inputs.nightly }}
          SIGNED: ${{ github.event_name == 'workflow_dispatch' && inputs.signed }}
        run: |
          set -euo pipefail
          if [ "$NIGHTLY" = true ]; then
            retention=3
          else
            retention=14
          fi
          signing=''
          if [ "$SIGNED" = true ]; then
            if ! signing=$(node scripts/signed-platforms.ts); then
              echo "::error::$signing"
              exit 1
            fi
            echo "Signing the packages of: $signing."
          fi
          table=$(node scripts/list-targets.ts)
          targets=''
          signed_targets=''
          while IFS='|' read -r target runner architecture platform night; do
            if [ "$NIGHTLY" = true ] && [ "$night" != nightly ]; then
              continue
            fi
            signed=false
            case " $signing " in
              *" $platform "*) signed=true ;;
            esac
            entry="{\"target\":\"$target\",\"runner\":\"$runner\",\"architecture\":\"$architecture\",\"platform\":\"$platform\",\"signed\":\"$signed\",\"nightly\":\"${NIGHTLY:-false}\",\"retention\":$retention}"
            if [ "$signed" = true ]; then
              signed_targets="$signed_targets${signed_targets:+,}$entry"
            else
              targets="$targets${targets:+,}$entry"
            fi
          done <<< "$table"
          echo "targets=[$targets]" >> "$GITHUB_OUTPUT"
          echo "signed-targets=[$signed_targets]" >> "$GITHUB_OUTPUT"

  package:
    name: Package and start (${{ matrix.target }})
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.targets) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    steps: &package-steps
      - name: Stop Spotlight indexing
        if: runner.os == 'macOS'
        timeout-minutes: 2
        run: sudo mdutil -i off /System/Volumes/Data

      - name: Check out the revision
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare the job
        timeout-minutes: 15
        uses: ./.github/actions/prepare
        with:
          architecture: ${{ matrix.architecture }}

      - name: Remove libfuse2, which a stock Ubuntu does not install
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          for name in libfuse2 libfuse2t64; do
            if dpkg-query -W -f='${Status}' "$name" 2>/dev/null | grep 'ok installed' > /dev/null; then
              sudo apt-get remove -y "$name"
            fi
          done
          if ldconfig -p | grep 'libfuse\.so\.2' > /dev/null; then
            echo "::error::libfuse2 is still installed."
            exit 1
          fi
          echo "libfuse2 is not installed."

      - name: Make the package
        id: package
        timeout-minutes: 40
        env:
          SIGNED: ${{ matrix.signed }}
          UPDATE_FEED: ${{ inputs.update-feed }}
          PACKAGE_VERSION: ${{ inputs.version }}
          AZURE_TENANT_ID: ${{ matrix.signed == 'true' && matrix.platform == 'windows' && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_ID: ${{ matrix.signed == 'true' && matrix.platform == 'windows' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ matrix.signed == 'true' && matrix.platform == 'windows' && secrets.AZURE_CLIENT_SECRET || '' }}
          MAC_CERTIFICATE: ${{ matrix.signed == 'true' && matrix.platform == 'macos' && secrets.MAC_CERTIFICATE || '' }}
          MAC_CERTIFICATE_PASSWORD: ${{ matrix.signed == 'true' && matrix.platform == 'macos' && secrets.MAC_CERTIFICATE_PASSWORD || '' }}
          APPLE_API_KEY_P8: ${{ matrix.signed == 'true' && matrix.platform == 'macos' && secrets.APPLE_API_KEY_P8 || '' }}
          APPLE_API_KEY_ID: ${{ matrix.signed == 'true' && matrix.platform == 'macos' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ matrix.signed == 'true' && matrix.platform == 'macos' && secrets.APPLE_API_ISSUER || '' }}
        run: |
          options=()
          if [ "$SIGNED" = true ]; then
            options+=(--signed)
          fi
          if [ -n "$UPDATE_FEED" ]; then
            if ! [[ "$UPDATE_FEED" =~ ^http://(127\.0\.0\.1|localhost|\[::1\]):([0-9]{1,5})/$ ]] || [ $((10#${BASH_REMATCH[2]})) -lt 1 ] || [ $((10#${BASH_REMATCH[2]})) -gt 65535 ]; then
              echo "::error::The update feed must be a loopback HTTP URL such as http://127.0.0.1:47325/, not $UPDATE_FEED."
              exit 1
            fi
            options+=(--update-feed "$UPDATE_FEED")
          fi
          if [ -n "$PACKAGE_VERSION" ]; then
            current=$(npm pkg get version)
            current=${current//\"/}
            next=''
            previous=''
            if [[ "$PACKAGE_VERSION" =~ ^(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})$ ]]; then
              printf -v next '%09d%09d%09d' "${BASH_REMATCH[1]}" "${BASH_REMATCH[2]}" "${BASH_REMATCH[3]}"
            fi
            if [[ "$current" =~ ^([0-9]{1,9})\.([0-9]{1,9})\.([0-9]{1,9})$ ]]; then
              printf -v previous '%09d%09d%09d' $((10#${BASH_REMATCH[1]})) $((10#${BASH_REMATCH[2]})) $((10#${BASH_REMATCH[3]}))
            fi
            if [ -z "$next" ] || [ -z "$previous" ] || ! [[ "$next" > "$previous" ]]; then
              echo "::error::The version must be X.Y.Z and newer than the root manifest's $current, not $PACKAGE_VERSION."
              exit 1
            fi
            npm pkg set "version=$PACKAGE_VERSION"
          fi
          if [ ${#options[@]} -eq 0 ]; then
            npm run package
          else
            npm run package -- "${options[@]}"
          fi

      - name: Install, start and quit the package
        id: smoke
        timeout-minutes: 15
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24' npm run package:smoke
            APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24' npm run package:smoke
          else
            npm run package:smoke
          fi

      - name: Read the product's name
        id: product
        timeout-minutes: 1
        run: |
          name=$(npm pkg get teamrun.product.name)
          echo "name=${name//\"/}" >> "$GITHUB_OUTPUT"

      - name: Keep the package
        id: keep
        continue-on-error: true
        timeout-minutes: 10
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-${{ matrix.runner }}-${{ matrix.architecture }}
          path: |
            _build/package/out/${{ steps.product.outputs.name }}-*.exe
            _build/package/out/${{ steps.product.outputs.name }}-*.dmg
            _build/package/out/${{ steps.product.outputs.name }}-*.zip
            _build/package/out/${{ steps.product.outputs.name }}-*.AppImage
            _build/package/smoke/*.png
            _build/package/package-report.json
          retention-days: ${{ matrix.retention }}
          if-no-files-found: error
          overwrite: true

      - name: Wait before keeping the package again
        if: steps.keep.outcome == 'failure'
        timeout-minutes: 1
        run: sleep 30

      - name: Keep the package again
        id: keep-again
        if: steps.keep.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: 10
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-${{ matrix.runner }}-${{ matrix.architecture }}
          path: |
            _build/package/out/${{ steps.product.outputs.name }}-*.exe
            _build/package/out/${{ steps.product.outputs.name }}-*.dmg
            _build/package/out/${{ steps.product.outputs.name }}-*.zip
            _build/package/out/${{ steps.product.outputs.name }}-*.AppImage
            _build/package/smoke/*.png
            _build/package/package-report.json
          retention-days: ${{ matrix.retention }}
          if-no-files-found: error
          overwrite: true

      - name: Wait before keeping the package a last time
        if: steps.keep-again.outcome == 'failure'
        timeout-minutes: 1
        run: sleep 30

      - name: Keep the package a last time
        if: steps.keep-again.outcome == 'failure'
        timeout-minutes: 10
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-${{ matrix.runner }}-${{ matrix.architecture }}
          path: |
            _build/package/out/${{ steps.product.outputs.name }}-*.exe
            _build/package/out/${{ steps.product.outputs.name }}-*.dmg
            _build/package/out/${{ steps.product.outputs.name }}-*.zip
            _build/package/out/${{ steps.product.outputs.name }}-*.AppImage
            _build/package/smoke/*.png
            _build/package/package-report.json
          retention-days: ${{ matrix.retention }}
          if-no-files-found: error
          overwrite: true

      - name: Record the nightly result
        if: always() && matrix.nightly == 'true'
        timeout-minutes: 1
        env:
          NIGHTLY_LABEL: packaging ${{ matrix.target }}
          NIGHTLY_PART: packaging
          NIGHTLY_OUTCOME: ${{ steps.smoke.outcome }}
        run: node scripts/nightly-result.ts

      - name: Keep the nightly result
        id: result
        if: always() && matrix.nightly == 'true'
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-result-${{ matrix.runner }}-packaging
          path: _build/nightly/results
          retention-days: 14
          if-no-files-found: ignore
          overwrite: true

      - name: Wait before keeping the nightly result again
        if: always() && matrix.nightly == 'true' && steps.result.outcome == 'failure'
        timeout-minutes: 1
        run: sleep 30

      - name: Keep the nightly result again
        id: result-again
        if: always() && matrix.nightly == 'true' && steps.result.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-result-${{ matrix.runner }}-packaging
          path: _build/nightly/results
          retention-days: 14
          if-no-files-found: ignore
          overwrite: true

      - name: Wait before keeping the nightly result a last time
        if: always() && matrix.nightly == 'true' && steps.result-again.outcome == 'failure'
        timeout-minutes: 1
        run: sleep 30

      - name: Keep the nightly result a last time
        if: always() && matrix.nightly == 'true' && steps.result-again.outcome == 'failure'
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-result-${{ matrix.runner }}-packaging
          path: _build/nightly/results
          retention-days: 14
          if-no-files-found: ignore
          overwrite: true

  package-signed:
    name: Package, sign and start (${{ matrix.target }})
    needs: plan
    if: needs.plan.outputs.signed-targets != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.signed-targets) }}
    runs-on: ${{ matrix.runner }}
    environment: release
    timeout-minutes: 75
    steps: *package-steps
