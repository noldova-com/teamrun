name: Package installers

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        options: [all, windows, linux, mac]
        default: all
        required: true
      architecture:
        description: CPU architecture to build
        type: choice
        options: [all, x64, arm64]
        default: all
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.platform }}-${{ inputs.architecture }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  package:
    name: Package ${{ matrix.platform }} ${{ matrix.architecture }}
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platform == 'all' && '["windows","linux","mac"]' || format('["{0}"]', inputs.platform)) }}
        architecture: ${{ fromJSON(inputs.architecture == 'all' && '["x64","arm64"]' || format('["{0}"]', inputs.architecture)) }}
    runs-on: >-
      ${{ fromJSON('{"windows-x64":"windows-2025","windows-arm64":"windows-11-arm",
      "linux-x64":"ubuntu-24.04","linux-arm64":"ubuntu-24.04-arm",
      "mac-x64":"macos-15-intel","mac-arm64":"macos-15"}')[format('{0}-{1}', matrix.platform, matrix.architecture)] }}
    timeout-minutes: 45
    env:
      CI: 'true'
      PACKAGE_PLATFORM: ${{ matrix.platform }}
      PACKAGE_ARCHITECTURE: ${{ matrix.architecture }}
    steps:
      - name: Check out the run revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '26.7.0'
          architecture: ${{ matrix.architecture }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/renderer/package-lock.json

      - name: Verify toolchain and architecture
        run: |
          node --version
          npm --version
          test "$(node --version)" = v26.7.0
          test "$(npm --version)" = 11.19.0
          test "$(node --print process.arch)" = "$PACKAGE_ARCHITECTURE"

      - name: Install dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/teamrun-package"
          trap 'cat "$RUNNER_TEMP/teamrun-package/install.stdout.log"; cat "$RUNNER_TEMP/teamrun-package/install.stderr.log" >&2' EXIT
          {
            npm ci --no-audit --no-fund
            npm ci --prefix src/renderer --no-audit --no-fund
          } > "$RUNNER_TEMP/teamrun-package/install.stdout.log" 2> "$RUNNER_TEMP/teamrun-package/install.stderr.log"

      - name: Build packages and renderer
        run: |
          trap 'cat "$RUNNER_TEMP/teamrun-package/build.stdout.log"; cat "$RUNNER_TEMP/teamrun-package/build.stderr.log" >&2' EXIT
          npm run build > "$RUNNER_TEMP/teamrun-package/build.stdout.log" 2> "$RUNNER_TEMP/teamrun-package/build.stderr.log"

      - name: Prepare Electron runtime
        run: |
          trap 'cat "$RUNNER_TEMP/teamrun-package/electron.stdout.log"; cat "$RUNNER_TEMP/teamrun-package/electron.stderr.log" >&2' EXIT
          {
            node node_modules/electron/install.js
            npm run desktop -- --prepare-only
            if [ "$RUNNER_OS" = Linux ]; then
              sudo chown root:root node_modules/electron/dist/chrome-sandbox
              sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
              sudo chown root:root _build/electron-dev/chrome-sandbox
              sudo chmod 4755 _build/electron-dev/chrome-sandbox
            fi
          } > "$RUNNER_TEMP/teamrun-package/electron.stdout.log" 2> "$RUNNER_TEMP/teamrun-package/electron.stderr.log"

      - name: Verify packages, renderer and desktop UI
        run: |
          trap 'cat "$RUNNER_TEMP/teamrun-package/tests.stdout.log"; cat "$RUNNER_TEMP/teamrun-package/tests.stderr.log" >&2' EXIT
          {
            npm run test:package
            npm run test:desktop
            npm run test -- --skip-test-details --skip-coverage-details
            npm run test:renderer
            if [ "$RUNNER_OS" = Linux ]; then
              xvfb-run --auto-servernum npm run test:ui
            else
              npm run test:ui
            fi
          } > "$RUNNER_TEMP/teamrun-package/tests.stdout.log" 2> "$RUNNER_TEMP/teamrun-package/tests.stderr.log"

      - name: Build unsigned installers and integrity report
        run: |
          trap 'cat "$RUNNER_TEMP/teamrun-package/package.stdout.log"; cat "$RUNNER_TEMP/teamrun-package/package.stderr.log" >&2' EXIT
          npm run package -- --platform "$PACKAGE_PLATFORM" --arch "$PACKAGE_ARCHITECTURE" > "$RUNNER_TEMP/teamrun-package/package.stdout.log" 2> "$RUNNER_TEMP/teamrun-package/package.stderr.log"
          if [ "$RUNNER_OS" = Linux ]; then
            appimages=("$GITHUB_WORKSPACE/_build/package/linux-$PACKAGE_ARCHITECTURE/"*.AppImage)
            test "${#appimages[@]}" -eq 1
            inspection=$(mktemp -d "$RUNNER_TEMP/teamrun-appimage.XXXXXX")
            (
              cd "$inspection"
              "${appimages[0]}" --appimage-extract AppRun
              "${appimages[0]}" --appimage-extract '*.desktop'
              cmp "$GITHUB_WORKSPACE/_build/appimage/$PACKAGE_ARCHITECTURE/AppRun" squashfs-root/AppRun
              grep -Fx 'Exec=AppRun %U' squashfs-root/*.desktop
            ) >> "$RUNNER_TEMP/teamrun-package/package.stdout.log" 2>> "$RUNNER_TEMP/teamrun-package/package.stderr.log"
          fi

      - name: Retain installers and reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-${{ matrix.platform }}-${{ matrix.architecture }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            _build/package/${{ matrix.platform }}-${{ matrix.architecture }}/TeamRun-*
            _build/package/${{ matrix.platform }}-${{ matrix.architecture }}/latest*.yml
            _build/package/${{ matrix.platform }}-${{ matrix.architecture }}/package-report-*.json
          if-no-files-found: error
          retention-days: 7

      - name: Retain diagnostics
        id: ui-report
        if: always() && !cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-logs-${{ matrix.platform }}-${{ matrix.architecture }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/teamrun-package/*.log
            _build/ui-results/
            _build/ui-report/
          if-no-files-found: warn
          retention-days: 7

      - name: Retain main-window screenshot
        id: ui-main-window
        if: always() && !cancelled() && hashFiles('_build/ui-results/main-window.png') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-main-window-${{ matrix.platform }}-${{ matrix.architecture }}-${{ github.run_id }}-${{ github.run_attempt }}.png
          path: _build/ui-results/main-window.png
          archive: false
          if-no-files-found: error
          retention-days: 7

      - name: Link desktop UI evidence in the summary
        if: always() && !cancelled()
        env:
          UI_REPORT_URL: ${{ steps.ui-report.outputs.artifact-url }}
          UI_MAIN_WINDOW_URL: ${{ steps.ui-main-window.outputs.artifact-url }}
        run: |
          {
            if [ ! -f _build/ui-results/summary.md ]; then
              printf '\n### Desktop UI\n\nUI results were not produced. Check the preceding job steps.\n'
            fi
            printf '\n#### UI evidence\n\n'
            if [ -n "$UI_MAIN_WINDOW_URL" ]; then
              printf '[View main window (PNG)](%s)\n\n' "$UI_MAIN_WINDOW_URL"
            else
              printf 'Main-window screenshot was not captured or uploaded.\n\n'
            fi
            if [ -n "$UI_REPORT_URL" ]; then
              printf '[Download the full UI report, screenshots and traces](%s)\n\n' "$UI_REPORT_URL"
            else
              printf 'The full UI artifact is unavailable.\n\n'
            fi
            printf 'Artifacts are retained for seven days.\n'
          } >> "$GITHUB_STEP_SUMMARY"
