name: Package installers

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        options: [all, windows, linux, mac]
        default: all
        required: true
      architecture:
        description: CPU architecture to build
        type: choice
        options: [all, x64, arm64]
        default: all
        required: true
      signed:
        description: Sign the Windows and macOS builds with the release environment's credentials; macOS builds are also notarized
        type: boolean
        default: false
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.platform }}-${{ inputs.architecture }}
  cancel-in-progress: false

jobs:
  package:
    name: Package ${{ matrix.platform }} ${{ matrix.architecture }}
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platform == 'all' && '["windows","linux","mac"]' || format('["{0}"]', inputs.platform)) }}
        architecture: ${{ fromJSON(inputs.architecture == 'all' && '["x64","arm64"]' || format('["{0}"]', inputs.architecture)) }}
    uses: ./.github/workflows/package-target.yml
    with:
      platform: ${{ matrix.platform }}
      architecture: ${{ matrix.architecture }}
      revision: ${{ github.sha }}
      signed: ${{ inputs.signed && matrix.platform != 'linux' }}
