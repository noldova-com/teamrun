name: Docs

on:
  workflow_dispatch:
    inputs:
      version:
        description: The released version the site documents, such as 0.3.0
        required: true
        type: string
      commit:
        description: The full hash of the main commit the release built
        required: true
        type: string

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    name: Check the release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
      commit: ${{ steps.check.outputs.commit }}
    steps:
      - name: Check the version and that main holds its commit
        id: check
        env:
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The version must be major.minor.patch, such as 0.3.0, not \"$VERSION\"."
            exit 1
          fi
          if [[ ! "$COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The commit must be a full hash, 40 lowercase hexadecimal digits, not \"$COMMIT\"."
            exit 1
          fi
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$COMMIT...main" --jq .status)
          if [ "$status" != ahead ] && [ "$status" != identical ]; then
            echo "::error::main doesn't hold $COMMIT, so it isn't a release's commit."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"

  docs:
    name: Docs
    needs: release
    uses: noldova-com/.github/.github/workflows/docs-image.yml@190702f4535ab017e5e436ce47e3562c686eb477 # v2.43.0
    permissions:
      contents: read
      packages: write
    with:
      ref: ${{ needs.release.outputs.commit }}
      build: npm run set-version -- ${{ needs.release.outputs.version }} && npm ci --no-audit --no-fund && npm run build:docs
      output: _build/docs/browser
      image: teamrun-angular-docs

  latest:
    name: Move the latest label
    needs: docs
    uses: noldova-com/.github/.github/workflows/move-image-label.yml@190702f4535ab017e5e436ce47e3562c686eb477 # v2.43.0
    permissions:
      packages: write
    with:
      image: teamrun-angular-docs
      digest: ${{ needs.docs.outputs.digest }}
      label: latest
