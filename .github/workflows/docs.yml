name: Docs

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  docs:
    name: Docs
    uses: noldova-com/.github/.github/workflows/docs-image.yml@43df1a5296a892a1ed162a02ca2af77902d19bb8 # v2.51.2
    permissions:
      contents: read
      packages: write
    with:
      build: npm ci --no-audit --no-fund && npm run build:docs
      output: _build/docs/browser
      image: teamrun-angular-docs

  latest:
    name: Move the latest label
    needs: docs
    uses: noldova-com/.github/.github/workflows/move-image-label.yml@43df1a5296a892a1ed162a02ca2af77902d19bb8 # v2.51.2
    permissions:
      packages: write
    with:
      image: teamrun-angular-docs
      digest: ${{ needs.docs.outputs.digest }}
      label: latest
