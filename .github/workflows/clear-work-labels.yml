name: Clear work labels

on:
  issues:
    types: [closed]

permissions:
  issues: write

jobs:
  clear-labels:
    name: Clear work labels
    if: contains(github.event.issue.labels.*.name, 'in progress') || contains(github.event.issue.labels.*.name, 'paused')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Remove the in progress and paused labels
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          IN_PROGRESS: ${{ contains(github.event.issue.labels.*.name, 'in progress') }}
          PAUSED: ${{ contains(github.event.issue.labels.*.name, 'paused') }}
        run: |
          labels=()
          if [ "$IN_PROGRESS" = "true" ]; then labels+=(--remove-label "in progress"); fi
          if [ "$PAUSED" = "true" ]; then labels+=(--remove-label "paused"); fi
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" "${labels[@]}"
