name: Relock

on:
  workflow_dispatch:
    inputs:
      commit:
        description: The full hash of the commit to relock
        required: true
        type: string
      request:
        description: The release, as the dependents step sends it
        required: true
        type: string

permissions: {}

jobs:
  relock:
    name: Relock
    uses: noldova-com/.github/.github/workflows/relock-dependent.yml@420ac04362aa51bd2b8d302578b0ec2f52c72bb3 # v2.41.1
    permissions:
      contents: read
      packages: read
    with:
      commit: ${{ inputs.commit }}
      request: ${{ inputs.request }}
      install: false
      prepare-scripts: install:root build
      lock-scripts: app/package-lock.json=relock:app
