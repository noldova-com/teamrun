name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to release, which is the root manifest's, such as 0.0.2.
        required: true
        type: string
      revision:
        description: The full commit SHA on main to release.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Check the release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
      signed-targets: ${{ steps.targets.outputs.signed-targets }}
    steps:
      - name: Require the workflow from main
        timeout-minutes: 1
        env:
          REFERENCE: ${{ github.ref }}
        run: |
          if [ "$REFERENCE" != refs/heads/main ]; then
            echo "::error::A release runs the workflow from main, not from $REFERENCE."
            exit 1
          fi

      - name: Check out the revision
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false

      - name: Set up Node.js
        id: node
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '26.7.0'
          package-manager-cache: false

      - name: Wait before setting up Node.js again
        if: steps.node.outcome == 'failure'
        timeout-minutes: 1
        run: sleep 30

      - name: Set up Node.js again
        id: node-again
        if: steps.node.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '26.7.0'
          package-manager-cache: false

      - name: Wait before setting up Node.js a last time
        if: steps.node-again.outcome == 'failure'
        timeout-minutes: 1
        run: sleep 30

      - name: Set up Node.js a last time
        if: steps.node-again.outcome == 'failure'
        timeout-minutes: 5
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '26.7.0'
          package-manager-cache: false

      - name: Check the version and the revision
        id: check
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_REVISION: ${{ inputs.revision }}
        run: node scripts/release-check.ts

      - name: List the targets, apart from those the release signs
        id: targets
        timeout-minutes: 1
        env:
          SIGNING: ${{ steps.check.outputs.signed }}
        run: |
          set -euo pipefail
          table=$(node scripts/list-targets.ts)
          targets=''
          signed_targets=''
          while IFS='|' read -r target runner architecture platform _; do
            signed=false
            case " $SIGNING " in
              *" $platform "*) signed=true ;;
            esac
            entry="{\"target\":\"$target\",\"runner\":\"$runner\",\"architecture\":\"$architecture\",\"platform\":\"$platform\",\"signed\":\"$signed\"}"
            if [ "$signed" = true ]; then
              signed_targets="$signed_targets${signed_targets:+,}$entry"
            else
              targets="$targets${targets:+,}$entry"
            fi
          done <<< "$table"
          echo "targets=[$targets]" >> "$GITHUB_OUTPUT"
          echo "signed-targets=[$signed_targets]" >> "$GITHUB_OUTPUT"

  build:
    name: Build, test and package (${{ matrix.target }})
    needs: check
    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJSON(needs.check.outputs.targets) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 105
    steps: &build-steps
      - name: Stop Spotlight indexing
        if: runner.os == 'macOS'
        timeout-minutes: 2
        run: sudo mdutil -i off /System/Volumes/Data

      - name: Check out the revision
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false

      - name: Prepare the job
        timeout-minutes: 15
        uses: ./.github/actions/prepare
        with:
          architecture: ${{ matrix.architecture }}

      - name: Remove libfuse2, which a stock Ubuntu does not install
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          for name in libfuse2 libfuse2t64; do
            if dpkg-query -W -f='${Status}' "$name" 2>/dev/null | grep 'ok installed' > /dev/null; then
              sudo apt-get remove -y "$name"
            fi
          done
          if ldconfig -p | grep 'libfuse\.so\.2' > /dev/null; then
            echo "::error::libfuse2 is still installed."
            exit 1
          fi
          echo "libfuse2 is not installed."

      - name: Build
        timeout-minutes: 20
        run: npm run build

      - name: Test
        timeout-minutes: 30
        run: npm test

      - name: Make the package
        timeout-minutes: 40
        env:
          SIGNED: ${{ matrix.signed }}
          AZURE_TENANT_ID: ${{ matrix.signed == 'true' && matrix.platform == 'windows' && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_ID: ${{ matrix.signed == 'true' && matrix.platform == 'windows' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ matrix.signed == 'true' && matrix.platform == 'windows' && secrets.AZURE_CLIENT_SECRET || '' }}
          AZURE_SIGNING_ENDPOINT: ${{ matrix.signed == 'true' && matrix.platform == 'windows' && secrets.AZURE_SIGNING_ENDPOINT || '' }}
          AZURE_SIGNING_ACCOUNT: ${{ matrix.signed == 'true' && matrix.platform == 'windows' && secrets.AZURE_SIGNING_ACCOUNT || '' }}
          AZURE_SIGNING_PROFILE: ${{ matrix.signed == 'true' && matrix.platform == 'windows' && secrets.AZURE_SIGNING_PROFILE || '' }}
          MAC_CERTIFICATE: ${{ matrix.signed == 'true' && matrix.platform == 'macos' && secrets.MAC_CERTIFICATE || '' }}
          MAC_CERTIFICATE_PASSWORD: ${{ matrix.signed == 'true' && matrix.platform == 'macos' && secrets.MAC_CERTIFICATE_PASSWORD || '' }}
          APPLE_API_KEY_P8: ${{ matrix.signed == 'true' && matrix.platform == 'macos' && secrets.APPLE_API_KEY_P8 || '' }}
          APPLE_API_KEY_ID: ${{ matrix.signed == 'true' && matrix.platform == 'macos' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ matrix.signed == 'true' && matrix.platform == 'macos' && secrets.APPLE_API_ISSUER || '' }}
        run: |
          options=()
          if [ "$SIGNED" = true ]; then
            options+=(--signed)
          fi
          if [ -n "$UPDATE_FEED" ]; then
            if ! [[ "$UPDATE_FEED" =~ ^http://(127\.0\.0\.1|localhost|\[::1\]):([0-9]{1,5})/$ ]] || [ $((10#${BASH_REMATCH[2]})) -lt 1 ] || [ $((10#${BASH_REMATCH[2]})) -gt 65535 ]; then
              echo "::error::The update feed must be a loopback HTTP URL such as http://127.0.0.1:47325/, not $UPDATE_FEED."
              exit 1
            fi
            options+=(--update-feed "$UPDATE_FEED")
          fi
          if [ -n "$PACKAGE_VERSION" ]; then
            current=$(npm pkg get version)
            current=${current//\"/}
            next=''
            previous=''
            if [[ "$PACKAGE_VERSION" =~ ^(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})$ ]]; then
              printf -v next '%09d%09d%09d' "${BASH_REMATCH[1]}" "${BASH_REMATCH[2]}" "${BASH_REMATCH[3]}"
            fi
            if [[ "$current" =~ ^([0-9]{1,9})\.([0-9]{1,9})\.([0-9]{1,9})$ ]]; then
              printf -v previous '%09d%09d%09d' $((10#${BASH_REMATCH[1]})) $((10#${BASH_REMATCH[2]})) $((10#${BASH_REMATCH[3]}))
            fi
            if [ -z "$next" ] || [ -z "$previous" ] || ! [[ "$next" > "$previous" ]]; then
              echo "::error::The version must be X.Y.Z and newer than the root manifest's $current, not $PACKAGE_VERSION."
              exit 1
            fi
            npm pkg set "version=$PACKAGE_VERSION"
          fi
          if [ ${#options[@]} -eq 0 ]; then
            npm run package
          else
            npm run package -- "${options[@]}"
          fi

      - name: Install, start and quit the package
        timeout-minutes: 15
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24' npm run package:smoke
            APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24' npm run package:smoke
          else
            npm run package:smoke
          fi

      - name: Write the checksums and the update information
        timeout-minutes: 5
        run: npm run release:assets

      - name: Read the product's name
        id: product
        timeout-minutes: 1
        run: |
          name=$(npm pkg get teamrun.product.name)
          echo "name=${name//\"/}" >> "$GITHUB_OUTPUT"

      - name: Keep the release files
        id: keep
        continue-on-error: true
        timeout-minutes: 10
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.runner }}-${{ matrix.architecture }}
          path: |
            _build/package/out/${{ steps.product.outputs.name }}-*.exe
            _build/package/out/${{ steps.product.outputs.name }}-*.dmg
            _build/package/out/${{ steps.product.outputs.name }}-*.zip
            _build/package/out/${{ steps.product.outputs.name }}-*.AppImage
            _build/package/out/${{ steps.product.outputs.name }}-*.sha256
            _build/package/out/latest-*.yml
          retention-days: 14
          if-no-files-found: error
          overwrite: true

      - name: Wait before keeping the release files again
        if: steps.keep.outcome == 'failure'
        timeout-minutes: 1
        run: sleep 30

      - name: Keep the release files again
        id: keep-again
        if: steps.keep.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: 10
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.runner }}-${{ matrix.architecture }}
          path: |
            _build/package/out/${{ steps.product.outputs.name }}-*.exe
            _build/package/out/${{ steps.product.outputs.name }}-*.dmg
            _build/package/out/${{ steps.product.outputs.name }}-*.zip
            _build/package/out/${{ steps.product.outputs.name }}-*.AppImage
            _build/package/out/${{ steps.product.outputs.name }}-*.sha256
            _build/package/out/latest-*.yml
          retention-days: 14
          if-no-files-found: error
          overwrite: true

      - name: Wait before keeping the release files a last time
        if: steps.keep-again.outcome == 'failure'
        timeout-minutes: 1
        run: sleep 30

      - name: Keep the release files a last time
        if: steps.keep-again.outcome == 'failure'
        timeout-minutes: 10
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.runner }}-${{ matrix.architecture }}
          path: |
            _build/package/out/${{ steps.product.outputs.name }}-*.exe
            _build/package/out/${{ steps.product.outputs.name }}-*.dmg
            _build/package/out/${{ steps.product.outputs.name }}-*.zip
            _build/package/out/${{ steps.product.outputs.name }}-*.AppImage
            _build/package/out/${{ steps.product.outputs.name }}-*.sha256
            _build/package/out/latest-*.yml
          retention-days: 14
          if-no-files-found: error
          overwrite: true

      - name: Keep the package report
        id: keep-report
        continue-on-error: true
        timeout-minutes: 10
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-${{ matrix.runner }}-${{ matrix.architecture }}
          path: _build/package/package-report.json
          retention-days: 14
          if-no-files-found: error
          overwrite: true

      - name: Wait before keeping the package report again
        if: steps.keep-report.outcome == 'failure'
        timeout-minutes: 1
        run: sleep 30

      - name: Keep the package report again
        id: keep-report-again
        if: steps.keep-report.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: 10
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-${{ matrix.runner }}-${{ matrix.architecture }}
          path: _build/package/package-report.json
          retention-days: 14
          if-no-files-found: error
          overwrite: true

      - name: Wait before keeping the package report a last time
        if: steps.keep-report-again.outcome == 'failure'
        timeout-minutes: 1
        run: sleep 30

      - name: Keep the package report a last time
        if: steps.keep-report-again.outcome == 'failure'
        timeout-minutes: 10
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-${{ matrix.runner }}-${{ matrix.architecture }}
          path: _build/package/package-report.json
          retention-days: 14
          if-no-files-found: error
          overwrite: true

  build-signed:
    name: Build, test, package and sign (${{ matrix.target }})
    needs: check
    if: needs.check.outputs.signed-targets != '[]'
    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJSON(needs.check.outputs.signed-targets) }}
    runs-on: ${{ matrix.runner }}
    environment: release
    timeout-minutes: 105
    steps: *build-steps

  publish:
    name: Publish the release
    needs: [build, build-signed]
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.build-signed.result == 'success' || needs.build-signed.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: publish
    permissions:
      contents: write
    concurrency:
      group: release-publish-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Check out the revision
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false

      - name: Set up Node.js
        id: node
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '26.7.0'
          package-manager-cache: false

      - name: Wait before setting up Node.js again
        if: steps.node.outcome == 'failure'
        timeout-minutes: 1
        run: sleep 30

      - name: Set up Node.js again
        id: node-again
        if: steps.node.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '26.7.0'
          package-manager-cache: false

      - name: Wait before setting up Node.js a last time
        if: steps.node-again.outcome == 'failure'
        timeout-minutes: 1
        run: sleep 30

      - name: Set up Node.js a last time
        if: steps.node-again.outcome == 'failure'
        timeout-minutes: 5
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '26.7.0'
          package-manager-cache: false

      - name: Take this run's release files
        timeout-minutes: 10
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          merge-multiple: true
          path: _build/release

      - name: Take this run's package reports
        timeout-minutes: 10
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: report-*
          path: _build/release-reports

      - name: Publish the release
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_REVISION: ${{ inputs.revision }}
          RELEASE_FOLDER: ${{ github.workspace }}/_build/release
          RELEASE_REPORTS: ${{ github.workspace }}/_build/release-reports
          RELEASE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/release-publish.ts
