name: Feature request
description: Suggest an improvement to TeamRun.
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Extra details (optional)
      description: Workarounds, links or screenshots, if useful. Remove private information before sharing.
