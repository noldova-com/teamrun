name: Bug report
description: Something is not working as expected.
body:
  - type: markdown
    attributes:
      value: >-
        For security issues, follow our [security policy](https://github.com/noldova-com/teamrun/blob/main/.github/SECURITY.md).
  - type: textarea
    id: actual
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce (optional)
      description: Tell us what you were doing, even if you cannot reproduce it every time.
  - type: textarea
    id: details
    attributes:
      label: Extra details (optional)
      description: App version, operating system, screenshots or logs, if useful. Remove private information before sharing.
