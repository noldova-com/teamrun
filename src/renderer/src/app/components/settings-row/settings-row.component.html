<div class="tr-setting tr-settings-row">
  <div class="tr-setting-title tr-emphasis">{{ label() }}</div>
  @if (hint(); as text) {
    <div class="tr-setting-description">{{ text }}</div>
  }
  <div class="tr-setting-control tr-value flex min-w-0 items-center gap-2">
    <ng-content />
  </div>
</div>
