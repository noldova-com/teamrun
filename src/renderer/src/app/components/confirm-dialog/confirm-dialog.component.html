<h2 mat-dialog-title>{{ request.title }}</h2>
<mat-dialog-content>
  <p class="mt-0">{{ request.text }}</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" mat-dialog-close>{{ resources.closeLabel }}</button>
  <button mat-flat-button type="button" cdkFocusInitial (click)="confirm()">{{ request.confirmLabel }}</button>
</mat-dialog-actions>
