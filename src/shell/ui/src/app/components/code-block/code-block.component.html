<div class="tr-code-block-header">
  @if (language(); as language) {
    <span class="tr-code-block-language" data-truncates>{{ language }}</span>
  }
  <div class="tr-code-block-actions" trToolbar [trToolbarLabel]="resources.codeBlockActionsLabel">
    <button type="button" tr-icon-button trToolbarItem class="tr-code-block-wrap" [icon]="resources.wordWrapGlyph" [label]="resources.wordWrapLabel" [pressed]="wrapped()"
      [trTooltip]="resources.wordWrapLabel" (click)="toggleWrap()"></button>
    <button type="button" tr-icon-button trToolbarItem class="tr-code-block-copy" [class.tr-code-block-copied]="isCopied()" [icon]="copyGlyph()" [label]="copyLabel()"
      [trTooltip]="copyLabel()" (click)="copy()"></button>
  </div>
</div>
<pre class="tr-code-block-body"><code>@if (tokens.hasValue()) {<ng-container>@for (token of tokens.value(); track $index) {<span [class]="token.className">{{ token.text }}</span>}</ng-container>}@else {<ng-container>{{ code() }}</ng-container>}</code></pre>
