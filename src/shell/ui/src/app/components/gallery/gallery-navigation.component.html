<tr-gallery-specimen [name]="text.tab">
  <tr-gallery-cell [caption]="text.defaultState">
    <div class="tr-gallery-strip" role="tablist" [attr.aria-label]="text.defaultState"><tr-tab [label]="text.tabNormal" [icon]="text.glyphDescription" /></div>
  </tr-gallery-cell>
  <tr-gallery-cell [caption]="text.hover">
    <div class="tr-gallery-strip" role="tablist" [attr.aria-label]="text.hover"><tr-tab trGalleryHover [label]="text.tabNormal" [icon]="text.glyphDescription" /></div>
  </tr-gallery-cell>
  <tr-gallery-cell [caption]="text.selected">
    <div class="tr-gallery-strip" role="tablist" [attr.aria-label]="text.selected"><tr-tab [label]="text.tabSelected" [icon]="text.glyphDescription" [selected]="true" /></div>
  </tr-gallery-cell>
  <tr-gallery-cell [caption]="text.tabPreviewCaption">
    <div class="tr-gallery-strip" role="tablist" [attr.aria-label]="text.tabPreviewCaption"><tr-tab [label]="text.tabPreview" [preview]="true" /></div>
  </tr-gallery-cell>
  <tr-gallery-cell [caption]="text.working">
    <div class="tr-gallery-strip" role="tablist" [attr.aria-label]="text.working"><tr-tab [label]="text.tabWorking" [working]="true" /></div>
  </tr-gallery-cell>
  <tr-gallery-cell [caption]="text.tabBadgeCaption">
    <div class="tr-gallery-strip" role="tablist" [attr.aria-label]="text.tabBadgeCaption"><tr-tab [label]="text.tabBadge" [badge]="text.tabBadgeLabel" [badgeCount]="3" /></div>
  </tr-gallery-cell>
  <tr-gallery-cell [caption]="text.tabNotClosableCaption">
    <div class="tr-gallery-strip" role="tablist" [attr.aria-label]="text.tabNotClosableCaption"><tr-tab [label]="text.tabNotClosable" [closable]="false" /></div>
  </tr-gallery-cell>
  <tr-gallery-cell [caption]="text.focus" [isFocusTarget]="true">
    <div class="tr-gallery-strip" role="tablist" [attr.aria-label]="text.focus"><tr-tab [label]="text.tabSelected" [icon]="text.glyphDescription" [selected]="true" /></div>
  </tr-gallery-cell>
  <tr-gallery-cell long [caption]="text.longCaption">
    <div class="tr-gallery-strip" role="tablist" [attr.aria-label]="text.longCaption"><tr-tab class="tr-gallery-narrow" [label]="text.tabLong" [icon]="text.glyphDescription" /></div>
  </tr-gallery-cell>
</tr-gallery-specimen>

<tr-gallery-specimen [name]="text.viewBadge">
  <tr-gallery-cell [caption]="text.defaultState"><tr-view-badge /></tr-gallery-cell>
  <tr-gallery-cell [caption]="text.chipCount"><tr-view-badge [count]="3" /></tr-gallery-cell>
  <tr-gallery-cell [caption]="text.chipLargeCount"><tr-view-badge [count]="120" /></tr-gallery-cell>
</tr-gallery-specimen>

<tr-gallery-specimen [name]="text.toolbar" [size]="sizes.Wide">
  <tr-gallery-cell [caption]="text.defaultState" [isFocusTarget]="true">
    <div trToolbar [trToolbarLabel]="text.toolbarLabel" class="tr-gallery-toolbar">
      <button type="button" tr-icon-button trToolbarItem [icon]="text.glyphAdd" [label]="text.button"></button>
      <button type="button" tr-icon-button trToolbarItem [icon]="text.glyphSave" [label]="text.pressed" [pressed]="true"></button>
      <button type="button" tr-icon-button trToolbarItem [icon]="text.iconGlyph" [label]="text.disabled" aria-disabled="true"></button>
    </div>
  </tr-gallery-cell>
</tr-gallery-specimen>

<tr-gallery-specimen [name]="text.toolbarButtons">
  <tr-gallery-cell [caption]="text.defaultState"><button type="button" tr-toolbar-button [icon]="text.glyphAdd" [label]="text.button"></button></tr-gallery-cell>
  <tr-gallery-cell [caption]="text.hover"><button type="button" tr-toolbar-button trGalleryHover [icon]="text.glyphAdd" [label]="text.button"></button></tr-gallery-cell>
  <tr-gallery-cell [caption]="text.toolbarWithLabel">
    <button type="button" tr-toolbar-button [icon]="text.glyphSave" [label]="text.toolbarWithLabel" [isShowingLabel]="true"></button>
  </tr-gallery-cell>
  <tr-gallery-cell [caption]="text.pressed"><button type="button" tr-toolbar-button [icon]="text.iconGlyph" [label]="text.pressed" [pressed]="true"></button></tr-gallery-cell>
  <tr-gallery-cell [caption]="text.menu">
    <button type="button" tr-toolbar-button [icon]="text.glyphDescription" [label]="text.menu" [isShowingLabel]="true" [hasMenu]="true"></button>
  </tr-gallery-cell>
  <tr-gallery-cell [caption]="text.disabled">
    <button type="button" tr-toolbar-button [icon]="text.glyphAdd" [label]="text.disabled" [isUnavailable]="true"></button>
  </tr-gallery-cell>
  <tr-gallery-cell [caption]="text.focus" [isFocusTarget]="true"><button type="button" tr-toolbar-button [icon]="text.glyphAdd" [label]="text.button"></button></tr-gallery-cell>
  <tr-gallery-cell long [caption]="text.longCaption"><button type="button" tr-toolbar-button class="tr-gallery-narrow" [label]="text.longText"></button></tr-gallery-cell>
</tr-gallery-specimen>

<tr-gallery-specimen [name]="text.sash">
  <tr-gallery-cell [caption]="text.sashVerticalCaption">
    <div class="tr-gallery-sash-box">
      <div class="tr-gallery-pane"></div>
      <tr-sash [orientation]="orientations.Vertical" [label]="text.sashVertical" />
      <div class="tr-gallery-pane"></div>
    </div>
  </tr-gallery-cell>
  <tr-gallery-cell [caption]="text.sashHorizontalCaption">
    <div class="tr-gallery-sash-box tr-gallery-sash-box-column">
      <div class="tr-gallery-pane"></div>
      <tr-sash [orientation]="orientations.Horizontal" [label]="text.sashHorizontal" />
      <div class="tr-gallery-pane"></div>
    </div>
  </tr-gallery-cell>
  <tr-gallery-cell [caption]="text.focus" [isFocusTarget]="true">
    <div class="tr-gallery-sash-box">
      <div class="tr-gallery-pane"></div>
      <tr-sash [orientation]="orientations.Vertical" [label]="text.sashVertical" />
      <div class="tr-gallery-pane"></div>
    </div>
  </tr-gallery-cell>
</tr-gallery-specimen>

<tr-gallery-specimen [name]="text.panelCard">
  <tr-gallery-cell [caption]="text.panelShellCaption"><tr-panel-card class="tr-gallery-card" [surface]="surfaces.Shell">{{ text.panelShell }}</tr-panel-card></tr-gallery-cell>
  <tr-gallery-cell [caption]="text.panelPanelCaption"><tr-panel-card class="tr-gallery-card">{{ text.panelPanel }}</tr-panel-card></tr-gallery-cell>
</tr-gallery-specimen>
