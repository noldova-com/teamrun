<tr-gallery-specimen [name]="text.button">
  <tr-gallery-cell [caption]="text.primary"><button type="button" tr-button>{{ text.primary }}</button></tr-gallery-cell>
  <tr-gallery-cell [caption]="text.hover"><button type="button" tr-button trGalleryHover>{{ text.primary }}</button></tr-gallery-cell>
  <tr-gallery-cell [caption]="text.secondary"><button type="button" tr-button [variant]="variants.Secondary">{{ text.secondary }}</button></tr-gallery-cell>
  <tr-gallery-cell [caption]="text.secondaryHover"><button type="button" tr-button trGalleryHover [variant]="variants.Secondary">{{ text.secondary }}</button></tr-gallery-cell>
  <tr-gallery-cell [caption]="text.disabled"><button type="button" tr-button disabled>{{ text.primary }}</button></tr-gallery-cell>
  <tr-gallery-cell [caption]="text.secondaryDisabled"><button type="button" tr-button [variant]="variants.Secondary" disabled>{{ text.secondary }}</button></tr-gallery-cell>
  <tr-gallery-cell [caption]="text.focus" [isFocusTarget]="true"><button type="button" tr-button>{{ text.primary }}</button></tr-gallery-cell>
  <tr-gallery-cell long [caption]="text.longCaption"><button type="button" tr-button class="tr-gallery-narrow">{{ text.longText }}</button></tr-gallery-cell>
</tr-gallery-specimen>

<tr-gallery-specimen [name]="text.iconButton">
  <tr-gallery-cell [caption]="text.defaultState"><button type="button" tr-icon-button [icon]="text.iconGlyph" [label]="text.iconLabel"></button></tr-gallery-cell>
  <tr-gallery-cell [caption]="text.hover"><button type="button" tr-icon-button trGalleryHover [icon]="text.iconGlyph" [label]="text.iconLabel"></button></tr-gallery-cell>
  <tr-gallery-cell [caption]="text.pressed">
    <button type="button" tr-icon-button [icon]="text.iconGlyph" [label]="text.pressed" [pressed]="isPressed()" (click)="isPressed.set(!isPressed())"></button>
  </tr-gallery-cell>
  <tr-gallery-cell [caption]="text.disabled"><button type="button" tr-icon-button [icon]="text.iconGlyph" [label]="text.disabled" disabled></button></tr-gallery-cell>
  <tr-gallery-cell [caption]="text.focus" [isFocusTarget]="true"><button type="button" tr-icon-button [icon]="text.iconGlyph" [label]="text.iconLabel"></button></tr-gallery-cell>
</tr-gallery-specimen>

<tr-gallery-specimen [name]="text.checkbox">
  <tr-gallery-cell [caption]="text.checked"><tr-checkbox [checked]="isChecked()" (checkedChange)="isChecked.set($event)">{{ text.checked }}</tr-checkbox></tr-gallery-cell>
  <tr-gallery-cell [caption]="text.unchecked"><tr-checkbox>{{ text.unchecked }}</tr-checkbox></tr-gallery-cell>
  <tr-gallery-cell [caption]="text.disabled"><tr-checkbox [checked]="true" [disabled]="true">{{ text.disabled }}</tr-checkbox></tr-gallery-cell>
  <tr-gallery-cell [caption]="text.focus" [isFocusTarget]="true"><tr-checkbox>{{ text.unchecked }}</tr-checkbox></tr-gallery-cell>
  <tr-gallery-cell long [caption]="text.longCaption"><tr-checkbox class="tr-gallery-narrow">{{ text.longText }}</tr-checkbox></tr-gallery-cell>
</tr-gallery-specimen>

<tr-gallery-specimen [name]="text.textField">
  <tr-gallery-cell [caption]="text.defaultState"><input type="text" tr-text-field [placeholder]="text.placeholder" [attr.aria-label]="text.textField" /></tr-gallery-cell>
  <tr-gallery-cell [caption]="text.disabled"><input type="text" tr-text-field [value]="text.disabled" [attr.aria-label]="text.disabled" disabled /></tr-gallery-cell>
  <tr-gallery-cell [caption]="text.error">
    <span class="tr-gallery-invalid">
      <input type="text" tr-text-field [value]="text.invalidField" [attr.aria-label]="text.error" aria-invalid="true" />
      <span class="tr-gallery-error">{{ text.validationText }}</span>
    </span>
  </tr-gallery-cell>
  <tr-gallery-cell [caption]="text.focus" [isFocusTarget]="true"><input type="text" tr-text-field [placeholder]="text.placeholder" [attr.aria-label]="text.focus" /></tr-gallery-cell>
  <tr-gallery-cell long [caption]="text.longCaption">
    <input type="text" tr-text-field [value]="text.longValue" [attr.aria-label]="text.longText" class="tr-gallery-narrow" />
  </tr-gallery-cell>
</tr-gallery-specimen>

<tr-gallery-specimen [name]="text.select" [size]="sizes.Wide">
  <tr-gallery-cell [caption]="text.defaultState"><tr-select [options]="options" [value]="choice()" [label]="text.select" (valueChange)="choice.set($event)" /></tr-gallery-cell>
  <tr-gallery-cell [caption]="text.disabled"><tr-select [options]="options" value="two" [label]="text.disabled" [disabled]="true" /></tr-gallery-cell>
  <tr-gallery-cell [caption]="text.focus" [isFocusTarget]="true"><tr-select [options]="options" value="one" [label]="text.focus" /></tr-gallery-cell>
  <tr-gallery-cell long [caption]="text.longCaption"><tr-select [options]="options" value="long" [label]="text.longText" class="tr-gallery-narrow" /></tr-gallery-cell>
</tr-gallery-specimen>

<tr-gallery-specimen [name]="text.progress">
  <tr-gallery-cell [caption]="text.progressDeterminate"><tr-progress class="tr-gallery-bar" [label]="text.determinate" [value]="0.5" /></tr-gallery-cell>
  <tr-gallery-cell [caption]="text.progressIndeterminate"><tr-progress class="tr-gallery-bar" [label]="text.indeterminate" /></tr-gallery-cell>
</tr-gallery-specimen>

<tr-gallery-specimen [name]="text.spinner">
  <tr-gallery-cell [caption]="text.working"><tr-spinner [label]="text.spinnerWorking" /></tr-gallery-cell>
  <tr-gallery-cell [caption]="text.delayed"><tr-spinner [label]="text.spinnerDelayed" [isDelayed]="true" /></tr-gallery-cell>
</tr-gallery-specimen>

<tr-gallery-specimen [name]="text.chip">
  <tr-gallery-cell [caption]="text.chipCount"><tr-chip [count]="3" /></tr-gallery-cell>
  <tr-gallery-cell [caption]="text.chipLargeCount"><tr-chip [count]="128" /></tr-gallery-cell>
  <tr-gallery-cell [caption]="text.chipAdded"><tr-chip [kind]="chipKinds.Added" [count]="12" /></tr-gallery-cell>
  <tr-gallery-cell [caption]="text.chipRemoved"><tr-chip [kind]="chipKinds.Removed" [count]="4" /></tr-gallery-cell>
  <tr-gallery-cell [caption]="text.chipKeyCaption"><tr-chip [kind]="chipKinds.Key">{{ text.chipKey }}</tr-chip></tr-gallery-cell>
</tr-gallery-specimen>

<tr-gallery-specimen [name]="text.choicePills" [size]="sizes.Wide">
  <tr-gallery-cell [caption]="text.defaultState">
    <tr-choice-pills [options]="pillOptions" [value]="pill()" [label]="text.choicePillsLabel" (valueChange)="pill.set($event)" />
  </tr-gallery-cell>
  <tr-gallery-cell [caption]="text.hover">
    <tr-choice-pills [trGalleryHover]="hoveredPill" [options]="pillOptions" [value]="text.choicePillInitial" [label]="text.hover" />
  </tr-gallery-cell>
  <tr-gallery-cell [caption]="text.focus" [isFocusTarget]="true"><tr-choice-pills [options]="pillOptions" [value]="text.choicePillInitial" [label]="text.focus" /></tr-gallery-cell>
  <tr-gallery-cell long [caption]="text.longCaption">
    <tr-choice-pills class="tr-gallery-narrow" [options]="longPillOptions" value="long" [label]="text.choicePillsLong" />
  </tr-gallery-cell>
</tr-gallery-specimen>
