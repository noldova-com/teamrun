@for (scope of scopes(); track scope.id) {
  <section #frame class="tr-gallery-scope-frame" [trGalleryScope]="scope.theme" [trGalleryMode]="scope.mode" [attr.aria-label]="scope.label" [attr.data-theme]="scope.theme.id"
    [attr.data-mode]="scope.mode">
    <h2 class="tr-gallery-scope-title">{{ scope.label }}</h2>
    <ng-container [ngTemplateOutlet]="specimens" [ngTemplateOutletInjector]="injectorOf(frame)" />
  </section>
}

<ng-template #specimens>
  <tr-gallery-forms />
  <tr-gallery-navigation />
  <tr-gallery-overlays />
</ng-template>
