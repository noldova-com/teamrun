<tr-gallery-specimen [name]="text.card">
  <tr-gallery-cell [caption]="text.defaultState">
    <tr-card class="tr-gallery-content-card"><strong>{{ text.cardTitle }}</strong><p class="tr-gallery-content-paragraph">{{ text.cardBody }}</p></tr-card>
  </tr-gallery-cell>
  <tr-gallery-cell long [caption]="text.longCaption">
    <tr-card class="tr-gallery-narrow">{{ text.cardLong }}</tr-card>
  </tr-gallery-cell>
</tr-gallery-specimen>

<tr-gallery-specimen [name]="text.codeBlock" [size]="sizes.Wide">
  <tr-gallery-cell [caption]="text.defaultState"><tr-code-block [language]="text.codeLanguage" [code]="text.codeSample" /></tr-gallery-cell>
  <tr-gallery-cell [caption]="text.codeWrappedCaption"><tr-code-block [language]="text.codeLanguage" [code]="text.codeSample" [wrapped]="true" /></tr-gallery-cell>
  <tr-gallery-cell [caption]="text.codeNoLanguageCaption"><tr-code-block [code]="text.codeCommand" /></tr-gallery-cell>
  <tr-gallery-cell [caption]="text.codeRefusedCaption"><tr-code-block trGalleryRefusingClipboard [language]="text.codeShell" [code]="text.codeCommand" /></tr-gallery-cell>
  <tr-gallery-cell [caption]="text.focus"><tr-code-block trGalleryFocus=".tr-code-block-copy" [language]="text.codeShell" [code]="text.codeCommand" /></tr-gallery-cell>
  <tr-gallery-cell long [caption]="text.longCaption">
    <tr-code-block class="tr-gallery-narrow" [language]="text.codeLongLanguage" [code]="text.codeLongLine" />
  </tr-gallery-cell>
</tr-gallery-specimen>

<tr-gallery-specimen [name]="text.inlineCode">
  <tr-gallery-cell [caption]="text.inlinePanelCaption">
    <p class="tr-gallery-content-paragraph">{{ text.inlineBefore }}<code tr-inline-code>{{ text.inlineName }}</code>{{ text.inlineAfter }}</p>
  </tr-gallery-cell>
  <tr-gallery-cell [caption]="text.inlineMessageCaption">
    <p class="tr-gallery-content-paragraph tr-gallery-content-message">{{ text.inlineBefore }}<code tr-inline-code>{{ text.inlineName }}</code>{{ text.inlineAfter }}</p>
  </tr-gallery-cell>
  <tr-gallery-cell long [caption]="text.longCaption">
    <p class="tr-gallery-content-paragraph tr-gallery-narrow">{{ text.inlineBefore }}<code tr-inline-code>{{ text.inlineLongName }}</code>{{ text.inlineAfter }}</p>
  </tr-gallery-cell>
</tr-gallery-specimen>
