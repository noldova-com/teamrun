<div class="tr-dialog-header">
  <h2 class="tr-dialog-title" [id]="titleId">{{ title() }}</h2>
  @if (isLarge()) {
    <button type="button" tr-icon-button class="tr-dialog-close" [icon]="resources.closeGlyph" [label]="resources.dialogCloseLabel" (click)="dismissed.emit()"></button>
  }
</div>
<div class="tr-dialog-body tr-scroll-reveal">
  <div class="tr-dialog-text">
    <ng-content />
  </div>
</div>
<div class="tr-dialog-actions">
  <ng-content select="[trDialogAction]" />
</div>
