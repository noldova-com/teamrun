<h2 class="tr-dialog-title" [id]="titleId">{{ title() }}</h2>
<div class="tr-dialog-body tr-scroll-reveal">
  <div class="tr-dialog-text">
    <ng-content />
  </div>
</div>
<div class="tr-dialog-actions">
  <ng-content select="[trDialogAction]" />
</div>
