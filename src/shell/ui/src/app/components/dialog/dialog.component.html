<div class="tr-dialog-header">
  <h2 class="tr-dialog-title" [id]="titleId" [attr.data-truncates]="isLarge() ? '' : null">{{ title() }}</h2>
  @if (isLarge()) {
    <div class="tr-dialog-controls">
      <ng-content select="[trDialogControl]" />
      <button type="button" tr-icon-button class="tr-dialog-maximize" [icon]="isMaximized() ? resources.dialogRestoreGlyph : resources.dialogMaximizeGlyph"
        [label]="maximizeLabel()" [trTooltip]="maximizeLabel()" (click)="toggleMaximized()"></button>
      <button type="button" tr-icon-button class="tr-dialog-close" [icon]="resources.closeGlyph" [label]="resources.dialogCloseLabel" [trTooltip]="resources.dialogCloseLabel"
        (click)="dismissed.emit()"></button>
    </div>
  }
</div>
<div class="tr-dialog-body">
  <ng-content />
</div>
<div class="tr-dialog-actions">
  <ng-content select="[trDialogAction]" />
</div>
