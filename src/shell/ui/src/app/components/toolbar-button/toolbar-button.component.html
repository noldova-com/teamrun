@if (icon(); as glyph) {
  <span class="tr-toolbar-button-glyph material-symbols-rounded" aria-hidden="true">{{ glyph }}</span>
}
@if (icon() === null || isShowingLabel()) {
  <span class="tr-toolbar-button-label" data-truncates>{{ label() }}</span>
}
@if (hasMenu()) {
  <span class="tr-toolbar-button-chevron material-symbols-rounded" aria-hidden="true">{{ resources.toolbarChevronGlyph }}</span>
}
