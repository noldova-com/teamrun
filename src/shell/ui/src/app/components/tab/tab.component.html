<span class="tr-tab-pill">
  @if (icon(); as glyph) {
    <span class="tr-tab-icon material-symbols-rounded" aria-hidden="true">{{ glyph }}</span>
  }
  <span class="tr-tab-label" data-truncates>{{ label() }}</span>
  @if (badge() !== null) {
    <tr-view-badge class="tr-tab-badge" [count]="badgeCount()" />
  }
  @if (closable() || working()) {
    <span class="tr-tab-action">
      @if (working()) {
        <tr-spinner class="tr-tab-spinner" aria-hidden="true" />
      }
      @if (closable()) {
        <button type="button" class="tr-tab-close" tabindex="-1" [attr.aria-label]="closeLabel()" (click)="onCloseClick($event)">
          <span class="material-symbols-rounded" aria-hidden="true">{{ resources.closeGlyph }}</span>
        </button>
      }
    </span>
  }
</span>
