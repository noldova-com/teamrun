<div #group class="tr-choice-pills-group" role="radiogroup" [attr.aria-label]="label()" (keydown)="move($event, group)">
  @for (option of options(); track option.value) {
    <button type="button" role="radio" class="tr-choice-pill" [class.tr-choice-pill-selected]="option.value === value()" [attr.aria-checked]="option.value === value()"
      [attr.tabindex]="option.value === tabStop() ? 0 : -1" (click)="choose(option.value)">{{ option.title }}</button>
  }
</div>
