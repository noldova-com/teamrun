<button #button type="button" class="tr-select-button" aria-haspopup="listbox" [attr.aria-expanded]="isOpen()" [disabled]="disabled()"
  [attr.aria-label]="label() + ', ' + title()" (click)="toggle(button, list)">
  <span class="tr-select-value" data-truncates>{{ title() }}</span>
  <span class="tr-select-arrow material-symbols-rounded" aria-hidden="true">{{ resources.selectGlyph }}</span>
</button>
<ng-template #list>
  <div class="tr-select-list" cdkListbox [cdkListboxValue]="marked()" [attr.aria-label]="label()" [style.min-width.px]="button.offsetWidth"
    (cdkListboxValueChange)="choose($event, button)" (keydown)="chooseAgain($event, button)">
    @for (option of options(); track option.value) {
      <div class="tr-select-option" [cdkOption]="option.value" [attr.data-value]="option.value" [trTooltip]="option.title"
        [trTooltipSide]="besideList" [trTooltipBeside]="resources.selectListSelector" [trTooltipTruncated]="true"
        (click)="closeOnCurrent(option.value, button)"><span class="tr-select-option-title" data-truncates>{{ option.title }}</span></div>
    }
  </div>
</ng-template>
