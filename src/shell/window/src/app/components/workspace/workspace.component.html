@let geometry = layout.geometry();
@for (side of sides; track side) {
  <tr-dock [side]="side" />
}
@for (frame of geometry.frames; track frame.group.id) {
  <tr-tab-group [frame]="frame">
    @if (frame.group.active; as active) {
      <tr-tab-content [tab]="active" />
    } @else if (isEmptyDocuments(frame)) {
      <tr-empty-window />
    }
  </tr-tab-group>
}
@for (handle of geometry.handles; track handle.split.id + "/" + handle.index) {
  <tr-split-sash [handle]="handle" />
}
<tr-docking-guides />
