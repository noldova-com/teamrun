<ng-template #pieces let-part>@for (piece of part.pieces; track $index) {@if (!$first) {<wbr>}{{ piece }}}</ng-template>@for (part of parts(); track $index) {@if (part.breaksBefore) {<wbr>}@if (part.isMatch) {<mark class="tr-highlighted-text-match"><ng-container *ngTemplateOutlet="pieces; context: { $implicit: part }" /></mark>} @else {<ng-container *ngTemplateOutlet="pieces; context: { $implicit: part }" />}}
