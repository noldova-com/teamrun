@if (dialogs.shown(); as tab) {
  <tr-dialog [title]="labels.of(tab).title" [size]="large" (dismissed)="dialogs.close()">
    <tr-tab-content class="tr-view-dialog-content" [tab]="tab" />
  </tr-dialog>
}
