@if (failures().length > 0) {
  <button type="button" class="tr-module-failures-item" [trPopoverTrigger]="popover">
    <span class="material-symbols-rounded tr-module-failures-icon" aria-hidden="true">{{ resources.moduleFailureGlyph }}</span>
    <span>{{ resources.formatModulesDidNotStart(failures().length) }}</span>
  </button>
  <ng-template #popover>
    <tr-module-failures-popover [label]="resources.moduleFailuresTitle" [failures]="failures()" />
  </ng-template>
}
