<tr-card class="tr-module-failure-card">
  <h2 class="tr-module-failure-card-title">
    <span class="material-symbols-rounded tr-module-failure-card-icon" aria-hidden="true">{{ resources.moduleFailureGlyph }}</span>
    <span>{{ resources.formatModuleDidNotStart(failure().displayName) }}</span>
  </h2>
  <p class="tr-module-failure-card-cause">{{ failure().cause }}</p>
</tr-card>
