<h2 class="tr-module-failures-title">{{ resources.moduleFailuresTitle }}</h2>
<ul class="tr-module-failures-list">
  @for (failure of failures(); track failure.moduleId) {
    <li class="tr-module-failures-row" [attr.data-module]="failure.moduleId">
      <span class="tr-module-failures-name">{{ failure.displayName }}</span>
      <span class="tr-module-failures-state">{{ resources.moduleStateLabels[failure.state] }}</span>
      <span class="tr-module-failures-cause">{{ failure.cause }}</span>
    </li>
  }
</ul>
<div class="tr-module-failures-actions">
  <button type="button" tr-button class="tr-module-failures-copy" [variant]="secondary" (click)="copy()">
    <span trButtonIcon class="material-symbols-rounded tr-module-failures-glyph" aria-hidden="true">{{ isCopied() ? resources.copiedGlyph : resources.copyGlyph }}</span>
    <span>{{ isCopied() ? resources.copiedLabel : resources.copyDetailsLabel }}</span>
  </button>
  <button type="button" tr-button class="tr-module-failures-logs" [variant]="secondary" (click)="openLogFolder()">
    <span trButtonIcon class="material-symbols-rounded tr-module-failures-glyph" aria-hidden="true">{{ resources.logFolderGlyph }}</span>
    <span>{{ resources.openLogFolderLabel }}</span>
  </button>
</div>
@if (isLogFolderFailed()) {
  <p class="tr-module-failures-notice" role="status">{{ resources.logFolderNotOpened }}</p>
}
