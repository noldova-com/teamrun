@switch (state().kind) {
  @case (kinds.Available) {
    @if (state().mustMove) {
      <button type="button" class="tr-update-item" (click)="openAbout()">
        <span class="material-symbols-rounded tr-update-item-icon" aria-hidden="true">{{ resources.updateAvailableGlyph }}</span>
        <span>{{ resources.moveToUpdateItem }}</span>
      </button>
    } @else {
      <button type="button" class="tr-update-item" (click)="download()">
        <span class="material-symbols-rounded tr-update-item-icon" aria-hidden="true">{{ resources.updateAvailableGlyph }}</span>
        <span>{{ resources.updateAvailableItem }}</span>
      </button>
    }
  }
  @case (kinds.Downloading) {
    <button type="button" class="tr-update-item" (click)="openAbout()">
      <span class="material-symbols-rounded tr-update-item-icon" aria-hidden="true">{{ resources.downloadUpdateGlyph }}</span>
      <span>{{ resources.formatDownloadingUpdate(state().progress) }}</span>
    </button>
  }
  @case (kinds.Ready) {
    <button type="button" class="tr-update-item" (click)="restart()">
      <span class="material-symbols-rounded tr-update-item-icon" aria-hidden="true">{{ resources.restartToUpdateGlyph }}</span>
      <span>{{ resources.restartToUpdateItem }}</span>
    </button>
  }
  @case (kinds.Failed) {
    <button type="button" class="tr-update-item" (click)="openAbout()">
      <span class="material-symbols-rounded tr-update-item-icon tr-update-item-error" aria-hidden="true">{{ resources.updateFailedGlyph }}</span>
      <span>{{ resources.updateFailedItem }}</span>
    </button>
  }
}
