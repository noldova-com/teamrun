<div class="tr-status-bar-side tr-status-bar-left">
  @for (item of bars.leftItems(); track item.name) {
    <tr-status-bar-item [item]="item" />
  }
</div>
<div class="tr-status-bar-side tr-status-bar-right">
  @for (item of bars.rightItems(); track item.name) {
    <tr-status-bar-item [item]="item" />
  }
  @if (updates.state().showsItem) {
    <tr-update-item />
  }
  <tr-notifications />
  <tr-module-failures />
</div>
