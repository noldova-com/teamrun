@if (isShown()) {
  @if (stripBounds(); as box) {
    @if (dock().root; as root) {
      <tr-panel-card class="tr-dock-strip" [class.tr-dock-strip-vertical]="isVertical()" [class.tr-dock-strip-rail]="isRail()" [surface]="surface"
        [attr.data-drop-group]="root.cornerGroup.id" data-drop-tabs trToolbar [trToolbarOrientation]="stripOrientation()" [trToolbarLabel]="resources.dockStripLabels[side()]"
        [style.left.rem]="box.x" [style.top.rem]="box.y" [style.width.rem]="box.width" [style.height.rem]="box.height">
        @for (entry of groupsOf(root); track entry[0].id; let first = $first) {
          @if (!first) {
            <span class="tr-dock-strip-separator" role="separator" [attr.aria-orientation]="separatorOrientation()"></span>
          }
          @for (tab of entry[1]; track tab.key) {
            @let label = labels.of(tab);
            <button type="button" tr-icon-button trToolbarItem class="tr-dock-strip-view" [attr.data-view]="tab.key" [icon]="label.icon" [label]="label.title"
              [pressed]="isShowing(entry[0], tab)" [trTooltip]="label.title" [trTooltipSide]="tooltipSide()" [trTooltipBeside]="resources.dockStripSelector" (click)="toggle(entry[0], tab)"></button>
          }
        }
      </tr-panel-card>
    }
  }
  @if (!isCollapsed()) {
    @let box = sash();
    <tr-sash class="tr-dock-sash" [orientation]="orientation()" [label]="resources.resizeDockLabels[side()]" [value]="pixels(size())"
      [minimum]="pixels(dock().minimumSize)" [maximum]="pixels(layout.geometry().maximumSize(side()))" (resize)="resize($event)"
      [style.left.rem]="box.x" [style.top.rem]="box.y" [style.width.rem]="box.width" [style.height.rem]="box.height" />
  }
}
