<ng-template #tabMenu>
  <tr-menu class="tr-tab-menu">
    @if (group(); as group) {
      @if (tab().equals(group.preview)) {
        <button tr-menu-item class="tr-tab-menu-keep" [icon]="resources.keepGlyph" [label]="resources.keepLabel" (triggered)="keep()"></button>
      }
      @if (tab().isMovable) {
        <button tr-menu-item class="tr-tab-menu-move" [icon]="resources.moveToGlyph" [label]="resources.moveToLabel" [disabled]="destinations().length === 0"
          [trMenuTriggerFor]="destinations().length === 0 ? null : moveMenu"></button>
        <button tr-menu-item class="tr-tab-menu-split" [icon]="resources.splitGlyph" [label]="resources.splitLabel" [disabled]="!canSplit(group)"
          [trMenuTriggerFor]="canSplit(group) ? splitMenu : null"></button>
        <button tr-menu-item class="tr-tab-menu-dock" [icon]="resources.dockGlyph" [label]="resources.dockLabel" [trMenuTriggerFor]="dockMenu"></button>
      }
      <button tr-menu-item class="tr-tab-menu-earlier" [icon]="resources.moveEarlierGlyph" [label]="resources.moveEarlierLabel" [disabled]="indexIn(group) === 0"
        (triggered)="shift(group, -1)"></button>
      <button tr-menu-item class="tr-tab-menu-later" [icon]="resources.moveLaterGlyph" [label]="resources.moveLaterLabel"
        [disabled]="indexIn(group) === group.tabs.length - 1" (triggered)="shift(group, 1)"></button>
      <ng-template #moveMenu>
        <tr-menu>
          @for (destination of destinations(); track destination.id) {
            <button tr-menu-item class="tr-tab-menu-destination" [attr.data-group]="destination.id" [label]="labelOf(destination)" (triggered)="moveTo(destination)"></button>
          }
        </tr-menu>
      </ng-template>
      <ng-template #splitMenu>
        <tr-menu>
          @for (edge of edges; track edge) {
            <button tr-menu-item class="tr-tab-menu-split-edge" [attr.data-edge]="edge" [icon]="resources.splitGlyphs[edge]" [label]="resources.splitLabels[edge]"
              (triggered)="split(group, edge)"></button>
          }
        </tr-menu>
      </ng-template>
      <ng-template #dockMenu>
        <tr-menu>
          @for (side of sides; track side) {
            <button tr-menu-item class="tr-tab-menu-dock-side" [attr.data-side]="side" [icon]="resources.dockGlyphs[side]" [label]="resources.dockLabels[side]"
              (triggered)="dock(side)"></button>
          }
        </tr-menu>
      </ng-template>
      <tr-menu-separator />
    }
    <button tr-menu-item class="tr-tab-menu-close" [icon]="resources.closeGlyph" [label]="resources.closeTabLabel" (triggered)="close()"></button>
    @if (group(); as group) {
      <button tr-menu-item class="tr-tab-menu-close-others" [icon]="resources.closeOthersGlyph" [label]="resources.closeOthersLabel" [disabled]="group.tabs.length < 2"
        (triggered)="closeOthers(group)"></button>
      <button tr-menu-item class="tr-tab-menu-close-right" [icon]="resources.closeToTheRightGlyph" [label]="resources.closeToTheRightLabel"
        [disabled]="indexIn(group) === group.tabs.length - 1" (triggered)="closeToTheRight(group)"></button>
      <button tr-menu-item class="tr-tab-menu-close-all" [icon]="resources.closeAllGlyph" [label]="resources.closeAllLabel" (triggered)="closeAll(group)"></button>
    }
    <tr-menu-separator />
    <button tr-menu-item class="tr-tab-menu-reset" [icon]="resources.resetLayoutGlyph" [label]="resources.resetLayoutLabel" (triggered)="reset()"></button>
  </tr-menu>
</ng-template>
