<ng-template #tabMenu>
  <tr-menu class="tr-tab-menu">
    @if (isEnabled(resources.keepTabCommand)) {
      <button tr-menu-item class="tr-tab-menu-keep" [icon]="resources.keepGlyph" [label]="resources.keepLabel" [shortcut]="keyOf(resources.keepTabCommand)"
        (triggered)="run(resources.keepTabCommand)"></button>
    }
    @if (group(); as group) {
      @if (tab().isMovable) {
        <button tr-menu-item class="tr-tab-menu-move" [icon]="resources.moveToGlyph" [label]="resources.moveToLabel" [disabled]="destinations().length === 0"
          [trMenuTriggerFor]="destinations().length === 0 ? null : moveMenu"></button>
        <button tr-menu-item class="tr-tab-menu-split" [icon]="resources.splitGlyph" [label]="resources.splitLabel" [disabled]="!canSplit()"
          [trMenuTriggerFor]="canSplit() ? splitMenu : null"></button>
        <button tr-menu-item class="tr-tab-menu-dock" [icon]="resources.dockGlyph" [label]="resources.dockLabel" [trMenuTriggerFor]="dockMenu"></button>
      }
      <ng-template #moveMenu>
        <tr-menu>
          @for (destination of destinations(); track destination.id) {
            <button tr-menu-item class="tr-tab-menu-destination" [attr.data-group]="destination.id" [label]="labelOf(destination)" (triggered)="moveTo(destination)"></button>
          }
        </tr-menu>
      </ng-template>
      <ng-template #splitMenu>
        <tr-menu>
          @for (edge of edges; track edge) {
            <button tr-menu-item class="tr-tab-menu-split-edge" [attr.data-edge]="edge" [icon]="resources.splitGlyphs[edge]" [label]="resources.splitLabels[edge]"
              [shortcut]="keyOf(resources.splitTabCommands[edge])" (triggered)="run(resources.splitTabCommands[edge])"></button>
          }
        </tr-menu>
      </ng-template>
      <ng-template #dockMenu>
        <tr-menu>
          @for (side of sides; track side) {
            <button tr-menu-item class="tr-tab-menu-dock-side" [attr.data-side]="side" [icon]="resources.dockGlyphs[side]" [label]="resources.dockLabels[side]"
              [shortcut]="keyOf(resources.dockTabCommands[side])" (triggered)="run(resources.dockTabCommands[side])"></button>
          }
        </tr-menu>
      </ng-template>
      <button tr-menu-item class="tr-tab-menu-earlier" [icon]="resources.moveEarlierGlyph" [label]="resources.moveEarlierLabel"
        [disabled]="!isEnabled(resources.moveTabLeftCommand)" [shortcut]="keyOf(resources.moveTabLeftCommand)" (triggered)="run(resources.moveTabLeftCommand)"></button>
      <button tr-menu-item class="tr-tab-menu-later" [icon]="resources.moveLaterGlyph" [label]="resources.moveLaterLabel"
        [disabled]="!isEnabled(resources.moveTabRightCommand)" [shortcut]="keyOf(resources.moveTabRightCommand)" (triggered)="run(resources.moveTabRightCommand)"></button>
      <tr-menu-separator />
    }
    <button tr-menu-item class="tr-tab-menu-close" [icon]="resources.closeGlyph" [label]="resources.closeTabLabel"
      [disabled]="!isEnabled(resources.closeTabCommand)" [shortcut]="keyOf(resources.closeTabCommand)" (triggered)="run(resources.closeTabCommand)"></button>
    @if (group()) {
      <button tr-menu-item class="tr-tab-menu-close-others" [icon]="resources.closeOthersGlyph" [label]="resources.closeOthersLabel"
        [disabled]="!isEnabled(resources.closeOtherTabsCommand)" [shortcut]="keyOf(resources.closeOtherTabsCommand)" (triggered)="run(resources.closeOtherTabsCommand)"></button>
      <button tr-menu-item class="tr-tab-menu-close-right" [icon]="resources.closeToTheRightGlyph" [label]="resources.closeToTheRightLabel"
        [disabled]="!isEnabled(resources.closeTabsToTheRightCommand)" [shortcut]="keyOf(resources.closeTabsToTheRightCommand)"
        (triggered)="run(resources.closeTabsToTheRightCommand)"></button>
      <button tr-menu-item class="tr-tab-menu-close-all" [icon]="resources.closeAllGlyph" [label]="resources.closeAllLabel"
        [disabled]="!isEnabled(resources.closeAllTabsCommand)" [shortcut]="keyOf(resources.closeAllTabsCommand)" (triggered)="run(resources.closeAllTabsCommand)"></button>
    }
    <tr-menu-separator />
    <button tr-menu-item class="tr-tab-menu-reset" [icon]="resources.resetLayoutGlyph" [label]="resources.resetLayoutLabel"
      [shortcut]="keyOf(resources.resetLayoutCommand)" (triggered)="run(resources.resetLayoutCommand)"></button>
  </tr-menu>
</ng-template>
