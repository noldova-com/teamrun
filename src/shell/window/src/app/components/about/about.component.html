<h2 class="tr-about-title">{{ version() }}</h2>
<p class="tr-about-platform">{{ platform }}</p>
<div class="tr-about-state">
<div class="tr-about-update">
  <p class="tr-about-status" role="status">
    <span>{{ status() }}</span>
    @if (canUpdate() && state().reason; as reason) {
      <span class="tr-about-reason">{{ reason }}</span>
    }
  </p>
  @if (canUpdate()) {
    @switch (state().kind) {
      @case (kinds.UpToDate) {
        <button type="button" tr-button [variant]="secondary" (click)="check()">{{ resources.checkForUpdatesTitle }}</button>
      }
      @case (kinds.Ready) {
        <button type="button" tr-button (click)="restart()">{{ resources.restartToUpdateLabel }}</button>
      }
      @case (kinds.Failed) {
        <button type="button" tr-button [variant]="secondary" (click)="check()">{{ resources.tryAgainLabel }}</button>
      }
    }
  }
</div>
@if (canUpdate() && state().kind === kinds.Downloading) {
  <tr-progress class="tr-about-progress" [label]="progressLabel()" [value]="share()" />
}
</div>
