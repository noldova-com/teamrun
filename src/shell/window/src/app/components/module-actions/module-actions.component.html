<div class="tr-module-actions-buttons">
  <button type="button" tr-button class="tr-module-actions-copy" [variant]="secondary" (click)="copy()">
    <span trButtonIcon class="material-symbols-rounded tr-module-actions-glyph" aria-hidden="true">{{ isCopied() ? resources.copiedGlyph : resources.copyGlyph }}</span>
    <span>{{ isCopied() ? resources.copiedLabel : resources.copyDetailsLabel }}</span>
  </button>
  <button type="button" tr-button class="tr-module-actions-logs" [variant]="secondary" (click)="openLogFolder()">
    <span trButtonIcon class="material-symbols-rounded tr-module-actions-glyph" aria-hidden="true">{{ resources.logFolderGlyph }}</span>
    <span>{{ resources.openLogFolderLabel }}</span>
  </button>
</div>
@if (isLogFolderFailed()) {
  <p class="tr-module-actions-notice" role="status">{{ resources.logFolderNotOpened }}</p>
}
