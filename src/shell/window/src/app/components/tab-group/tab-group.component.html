<tr-panel-card class="tr-tab-group-card" [surface]="surface()" [attr.data-drop-group]="group().id">
  <div class="tr-tab-group-bar">
    <div #scroller="trTabScroller" class="tr-tab-group-scroller tr-scroll-reveal" [trTabScroller]="actionBar" [trTabScrollerFrame]="frame()">
      <div class="tr-tab-group-strip" role="tablist" data-drop-tabs (keydown)="onStripKey($event)">
        @for (tab of group().tabs; track tab.key; let index = $index) {
          @let label = labels.of(tab);
          <tr-tab-menu #menu [tab]="tab" />
          <tr-tab [label]="label.title" [icon]="label.icon" [selected]="tab.equals(group().active)" [preview]="tab.equals(group().preview)" [attr.data-tab-index]="index"
            [attr.id]="tabId(index)" [attr.data-tab-key]="tab.key" [class.tr-tab-drop-before]="drag.isDropBefore(group().id, index)" [class.tr-tab-dragged]="tab.equals(drag.dragging())"
            [trTooltip]="label.title" [trTooltipSide]="below" [trTooltipTruncated]="true"
            [trContextMenuTriggerFor]="menu.menu()" (activate)="layout.activate(tab)" (close)="layout.close(tab)" (pointerdown)="drag.begin(tab, $event)" (dblclick)="keep(tab)" />
        }
        <span class="tr-tab-group-end" [class.tr-tab-drop-before]="drag.isDropBefore(group().id, group().tabs.length)"></span>
      </div>
      <div #actionBar class="tr-tab-group-actions" [class.tr-tab-group-actions-shell]="isShell()">
        @if (scroller.isOverflowing()) {
          <button #overflowTrigger="trMenuTriggerFor" type="button" tr-icon-button class="tr-tab-group-overflow" [icon]="resources.overflowGlyph"
            [label]="resources.overflowLabel" [trTooltip]="resources.overflowLabel" [trTooltipSide]="below" [trMenuTriggerFor]="overflow" [trMenuAlignment]="end"></button>
          <ng-template #overflow>
            <tr-menu class="tr-tab-group-overflow-menu">
              <button tr-menu-item class="tr-tab-group-overflow-close-all" [icon]="resources.closeAllGlyph" [label]="resources.closeAllLabel" (triggered)="closeAll()"></button>
              <tr-menu-separator />
              @for (tab of group().tabs; track tab.key) {
                @let label = labels.of(tab);
                <button tr-menu-item class="tr-tab-group-overflow-tab" [attr.data-tab]="tab.key" [attr.aria-current]="tab.equals(group().active) ? 'true' : null"
                  [icon]="label.icon" [label]="label.title" [trTooltip]="label.title" [trTooltipSide]="besides" [trTooltipTruncated]="true" (triggered)="choose(tab)"></button>
              }
            </tr-menu>
          </ng-template>
        }
        @if (group().active; as active) {
          <tr-tab-menu #actions [tab]="active" />
          <button type="button" tr-icon-button class="tr-tab-group-menu" [icon]="resources.panelActionsGlyph" [label]="resources.panelActionsLabel"
            [trTooltip]="resources.panelActionsLabel" [trTooltipSide]="below" [trMenuTriggerFor]="actions.menu()" [trMenuAlignment]="end"></button>
        }
        @if (hideSide(); as side) {
          <button type="button" tr-icon-button class="tr-tab-group-hide" [icon]="resources.hideDockGlyphs[side]" [label]="resources.hideDockLabels[side]"
            [trTooltip]="resources.hideDockLabels[side]" [trTooltipSide]="below" (click)="layout.toggleDock(side)"></button>
        }
      </div>
    </div>
  </div>
  <div class="tr-tab-group-body" role="tabpanel" [attr.id]="panelId()" [attr.aria-labelledby]="activeTabId()">
    <ng-content />
  </div>
</tr-panel-card>
