<ng-template #placeMenu>
  <tr-menu class="tr-place-menu" [attr.data-place]="place()">
    @for (section of sections(); track section.group; let first = $first) {
      @if (!first) {
        <tr-menu-separator />
      }
      @for (row of section.rows; track $index) {
        @if (row.isSubmenu) {
          <tr-place-menu #nested [place]="row.place" [context]="context()" />
          <button tr-menu-item class="tr-place-menu-submenu" [attr.data-submenu]="row.place" [label]="row.title" [trMenuTriggerFor]="nested.menu()"></button>
        } @else {
          <button tr-menu-item class="tr-place-menu-item" [attr.data-command]="row.command" [label]="row.title" [icon]="row.icon"
            [shortcut]="row.key" [disabled]="!row.isEnabled" (triggered)="run(row)"></button>
        }
      }
    }
  </tr-menu>
</ng-template>
