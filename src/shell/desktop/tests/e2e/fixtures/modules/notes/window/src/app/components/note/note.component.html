<h1 class="tr-notes-note-title" [attr.data-fixture-content]="'notes-note-' + instance()">{{ title() }}</h1>
@for (section of sections; track section) {
  <h2>{{ section }}</h2>
  <p>This section collects what we decided, what is still open and who follows up. Each item links back to the conversation where it came up, so the reasoning stays next to the decision.</p>
}
