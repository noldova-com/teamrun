<p class="tr-notes-list-text" data-fixture-content="notes-list">The notes list</p>
<ul class="tr-notes-list-items" [attr.data-sort]="sortBy()" [class.tr-notes-list-wrapped]="wrapsLines()">
  @for (note of sorted(); track note.week) {
    <li><button type="button" class="tr-notes-list-item" [trMenu]="'notes.listItem'" [trMenuContext]="{ week: note.week, title: note.title }"
      (click)="preview(note.week, note.title)" (dblclick)="keep(note.week)">{{ note.title }}</button></li>
  }
</ul>
