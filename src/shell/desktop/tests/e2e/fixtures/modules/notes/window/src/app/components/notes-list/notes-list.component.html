<p class="tr-notes-list-text" data-fixture-content="notes-list">The notes list</p>
<ul class="tr-notes-list-items">
  @for (note of notes; track $index) {
    <li><button type="button" class="tr-notes-list-item" (click)="preview($index, note)" (dblclick)="keep($index)">{{ note }}</button></li>
  }
</ul>
