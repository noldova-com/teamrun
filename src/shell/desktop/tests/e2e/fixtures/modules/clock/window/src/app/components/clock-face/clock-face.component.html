<p class="tr-clock-face-answer" data-fixture-content="clock-face">{{ answer() }}</p>
<p class="tr-clock-face-ticks" data-fixture-content="clock-ticks">{{ ticks() }}</p>
<p class="tr-clock-face-step" data-fixture-content="clock-step">Step: {{ step() }}</p>
<button type="button" data-fixture-content="clock-step-up" (click)="stepUp()">Step up</button>
<button type="button" data-fixture-content="clock-controls" [trMenu]="'clock.controls'">Controls</button>
