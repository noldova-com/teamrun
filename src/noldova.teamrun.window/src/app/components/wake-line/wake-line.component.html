<p class="wake-line" [id]="labelId()">
  <button type="button" class="wake-toggle" data-nol-resizes-row [attr.aria-expanded]="isOpen()" (click)="toggle()">{{ resources.wakeReceivedLabel }}</button>
  @if (chat(); as shown) {
    <button type="button" class="wake-chat" (click)="open(shown)">{{ shown.title }}</button>
  } @else {
    <span class="wake-chat-gone">{{ resources.wakeChatGone }}</span>
  }
  <button type="button" class="wake-chevron material-symbols-rounded" tabindex="-1" aria-hidden="true" data-nol-resizes-row (click)="toggle()">{{ isOpen() ? resources.expandedIcon : resources.collapsedIcon }}</button>
</p>
@if (isOpen()) {
  <div class="wake-replies" role="region" [attr.aria-label]="resources.wakeRepliesLabel">
    @for (reply of received().replies; track $index) {
      <p class="wake-reply-heading">{{ headingOf(reply) }}</p>
      @if (reply.text; as text) {
        <p class="wake-reply-text">{{ text }}</p>
      }
    }
  </div>
}
