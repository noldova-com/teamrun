<div class="nol-teamrun-terminal-head">
  <span class="nol-teamrun-terminal-title">{{ resources.formatTerminalHeading(title()) }}</span>
  <button type="button" nol-icon-button class="nol-teamrun-close-terminal" [icon]="resources.closeIcon" [label]="resources.formatCloseTerminal(title())"
    (click)="closed.emit()"></button>
</div>
@if (unavailable()) {
  <p class="nol-teamrun-muted nol-teamrun-terminal-unavailable">{{ resources.terminalUnavailable }}</p>
}
<div #screen class="nol-teamrun-terminal-screen nol-terminal-dark" [hidden]="unavailable()"></div>
