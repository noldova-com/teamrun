<div class="nol-teamrun-organization-inbox-head">
  <h2 class="nol-teamrun-organization-inbox-title">{{ resources.organizationInboxTitle }}</h2>
  <span class="nol-teamrun-organization-unread">{{ unreadCount() === 0 ? resources.organizationAllRead : resources.formatOrganizationUnread(unreadCount()) }}</span>
</div>
<ul class="nol-teamrun-organization-conversations" [attr.aria-label]="resources.organizationChatsLabel">
  @for (row of rows(); track row.chatId) {
    <li>
      <button type="button" class="nol-teamrun-organization-conversation" [class.nol-teamrun-organization-conversation-selected]="row.teammateId === selectedTeammateId()"
        [attr.aria-current]="row.teammateId === selectedTeammateId() ? 'true' : null" (click)="choose(row)">
        @if (row.teammate) {
          <nol-teamrun-teammate-avatar [teammate]="row.teammate" [size]="avatar" [decorative]="true" />
        }
        <span class="nol-teamrun-organization-conversation-text">
          <span class="nol-teamrun-organization-conversation-top">
            <span class="nol-teamrun-organization-conversation-title">{{ row.name }}</span>
            <span class="nol-teamrun-organization-conversation-time">{{ row.status ?? row.time }}</span>
          </span>
          <span class="nol-teamrun-organization-conversation-line">{{ row.lastLine }}</span>
        </span>
        @if (row.unread > 0) {
          <nol-chip [count]="row.unread" />
        }
      </button>
    </li>
  } @empty {
    <li class="nol-teamrun-organization-empty">{{ resources.organizationNoMessages }}</li>
  }
</ul>
