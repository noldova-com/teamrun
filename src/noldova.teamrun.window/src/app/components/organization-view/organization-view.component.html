<header class="top">
  <h1 class="title">{{ resources.organizationTitle }}</h1>
  <span class="headcount">{{ headcount() }}</span>
</header>
@if (organization.loadError(); as error) {
  <div class="failure">
    <p class="error" role="alert">{{ error }}</p>
    <button type="button" nol-button [variant]="text" (click)="organization.reload()">{{ resources.replyHistoryRetry }}</button>
  </div>
}
<main class="chart" [attr.aria-label]="resources.organizationStructureLabel">
  <div class="tree">
    <div class="owner">
      <nol-avatar [name]="resources.organizationOwnerName" [decorative]="true" />
      <div class="who">
        <span class="name">{{ resources.organizationOwnerName }}</span>
        <span class="role">{{ ownerRole() }}</span>
      </div>
    </div>
    @if (tree().length > 0) {
      <div class="kids">
        @for (node of tree(); track node.department.id) {
          <nol-teamrun-organization-department class="kid" [node]="node" />
        }
      </div>
    } @else {
      <p class="empty">{{ resources.organizationEmpty }}</p>
    }
  </div>
</main>
