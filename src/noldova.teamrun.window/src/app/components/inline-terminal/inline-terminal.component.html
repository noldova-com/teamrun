@if (isBusy()) {
  <div class="busy" role="group" [attr.aria-label]="resources.shellRunBusy">
    <p class="busy-text">{{ resources.shellRunBusy }}</p>
    <button type="button" nol-button class="busy-stop" [variant]="outlined" (click)="answer(true)">{{ resources.shellRunStop }}</button>
    <button type="button" nol-button class="busy-new" [variant]="outlined" (click)="answer(false)">{{ resources.shellRunNewTerminal }}</button>
  </div>
}
@if (output(); as output) {
  <nol-code-block class="output" [code]="output" [language]="null" />
}
<div #live class="live"></div>
