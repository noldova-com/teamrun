<div class="head">
  <nol-teamrun-teammate-avatar [teammate]="teammate()" [decorative]="true" />
  <div class="who">
    <span class="name">{{ teammate().name }}</span>
    @if (teammate().role; as role) {
      <span class="role">{{ role }}</span>
    }
  </div>
</div>
