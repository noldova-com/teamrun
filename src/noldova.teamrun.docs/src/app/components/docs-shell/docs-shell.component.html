<nol-site-header #header [wordmark]="resources.wordmarkFile" [name]="resources.siteName" [homeHref]="resources.homeLink" [version]="version" [versionHref]="releaseNotesLink"
  [links]="links()" [social]="social" [downloadHref]="downloadLink" [wide]="true" [contentId]="resources.mainId"
  [(menuOpen)]="isSiteMenuOpen" [(searchOpen)]="isSearchOpen" (click)="followLink($event)">
  <nol-docs-search nolSiteSearch />
</nol-site-header>
<nol-docs-pages-bar #pagesBar controls="nol-docs-menu" [open]="isMenuOpen()" (openChange)="toggleMenu($event)" />
<div class="nol-docs-body">
  <nav id="nol-docs-menu" class="nol-docs-menu" [class.nol-docs-menu-open]="isMenuOpen()" [attr.aria-label]="resources.menuLabel" (keydown.escape)="closeMenu()">
    @for (group of groups; track group.label) {
      <nol-section-header [label]="group.label" [level]="resources.menuGroupLevel" />
      <ul class="nol-docs-menu-list">
        @for (page of group.pages; track page.path) {
          <li><a class="nol-docs-menu-link" [routerLink]="page.link" routerLinkActive="nol-docs-menu-current" ariaCurrentWhenActive="page" [routerLinkActiveOptions]="{ exact: true }"
            (click)="choosePage()">{{ page.title }}</a></li>
        }
      </ul>
    }
  </nav>
  <main #main class="nol-docs-main" [id]="resources.mainId" tabindex="-1">
    <router-outlet />
  </main>
  <nol-docs-on-this-page [content]="main" />
</div>
<nol-site-footer [wordmark]="resources.wordmarkFile" [name]="resources.siteName" [homeHref]="resources.homeLink" [groups]="footerGroups()" [wide]="true" (click)="followLink($event)" />
